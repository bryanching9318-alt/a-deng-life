/* 密码 SHA-256 */  
async function hash(s){  
  
  const b =  
  await crypto.subtle.digest(  
    "SHA-256",  
    new TextEncoder().encode(s)  
  );  
  
  return [  
    ...new Uint8Array(b)  
  ]  
  .map(x =>  
    x.toString(16).padStart(2,"0")  
  )  
  .join("");  
  
}  
  
  
/* 注册 */  
async function register(){  
  
  const u =  
  username.value.trim();  
  
  const p =  
  password.value;  
  
  if(  
    u.length < 3 ||  
    p.length < 6  
  ){  
  
    return msg(  
      "authMsg",  
      "账号至少3个字符，密码至少6个字符。"  
    );  
  
  }  
  
  const h =  
  await hash(p);  
  
  const {  
    data,  
    error  
  } =  
  await sb  
  .from("app_accounts")  
  .insert({  
    username:u,  
    password_hash:h  
  })  
  .select("id,username")  
  .single();  
  
  
  if(error){  
  
    return msg(  
      "authMsg",  
      error.code === "23505"  
      ? "这个账号已经存在，请直接登录。"  
      : "注册失败："+error.message  
    );  
  
  }  
  
  await start(data);  
  
  msg("authMsg","");  
  
}  
  
  
/* 登录 */  
async function login(){  
  
  const u =  
  username.value.trim();  
  
  const p =  
  password.value;  
  
  if(!u || !p){  
  
    return msg(  
      "authMsg",  
      "请输入账号和密码。"  
    );  
  
  }  
  
  const h =  
  await hash(p);  
  
  const {  
    data,  
    error  
  } =  
  await sb  
  .from("app_accounts")  
  .select("id,username")  
  .eq("username",u)  
  .eq("password_hash",h)  
  .maybeSingle();  
  
  
  if(error || !data){  
  
    return msg(  
      "authMsg",  
      "账号或密码不正确。"  
    );  
  
  }  
  
  await start(data);  
  
}  
  
  
/* 登录成功 */

  localStorage.setItem(

/* 退出 */  
async function logout(){  
  
  currentUser = null;

  localStorage.removeItem(

  );  
  
  app.classList.add("hide");

/* 读取云端记录 */  
async function load(){  
  
  const {  
    data,  
    error  
  } =  
  await sb  
  .from("diary_entries")  
  .select("*")  
  .eq("account_id",currentUser.id)  
  .order("date",{ascending:false})  
  .order("created_at",{ascending:false});  
  
  
  if(error){  
  
    saveMsg.textContent =  
    "读取失败："+error.message;  
  
    return;  
  
  }  
  
  entries =  
  data || [];  
  
  updateStats();  
  
  render();  
  
}  
  
  
/* 保存记录 */  
async function saveEntry(){  
  
  if(!currentUser)  
    return;  
  
  
  msg(  
    "saveMsg",  
    "正在保存……"  
  );  
  
  
  const files =  
  [  
    ...(document  
      .getElementById("photos")  
      .files || [])  
  ];  
  
  
  let photoUrls = [];  
  
  
  /* 上传照片 */  
  for(const file of files){  
  
    const safe =  
    file.name.replace(  
      /[^\w.\-一-龥]/g,  
      "_"  
    );  
  
  
    const path =  
    currentUser.id +  
    "/" +  
    Date.now() +  
    "_" +  
    Math.random()  
      .toString(36)  
      .slice(2) +  
    "_" +  
    safe;  
  
  
    const up =  
    await sb  
    .storage  
    .from(CLOUD_BUCKET)  
    .upload(  
      path,  
      file,  
      {  
        upsert:false  
      }  
    );  
  
  
    if(up.error){  
  
      return msg(  
        "saveMsg",  
        "照片上传失败："+up.error.message  
      );  
  
    }  
  
  
    const signed =  
    await sb  
    .storage  
    .from(CLOUD_BUCKET)  
    .createSignedUrl(  
      path,  
      60*60*24*365  
    );  
  
  
    if(signed.error){  
  
      return msg(  
        "saveMsg",  
        "照片链接生成失败："+signed.error.message  
      );  
  
    }  
  
  
    photoUrls.push(  
      signed.data.signedUrl  
    );  
  
  }  
  
  
  const payload = {  
  
    account_id:  
    currentUser.id,  
  
    date:  
    date.value,  
  
    type:  
    type.value,  
  
    title:  
    title.value.trim() ||  
    "今天的记录",  
  
    content:  
    content.value,  
  
    mood:  
    mood.value,  
  
    score:  
    score.value,  
  
    lesson:  
    lesson.value,  
  
    photos:  
    photoUrls  
  
  };  
  
  
  let r;  
  
  
  /* 编辑 */  
  if(editingId){  
  
    const old =  
    entries.find(  
      x => x.id === editingId  
    );  
  
  
    payload.photos = [  
      ...(old?.photos || []),  
      ...photoUrls  
    ];  
  
  
    r =  
    await sb  
    .from("diary_entries")  
    .update(payload)  
    .eq("id",editingId)  
    .eq(  
      "account_id",  
      currentUser.id  
    );  
  
  }  
  
  
  /* 新增 */  
  else{  
  
    r =  
    await sb  
    .from("diary_entries")  
    .insert(payload);  
  
  }  
  
  
  if(r.error){  
  
    return msg(  
      "saveMsg",  
      "保存失败："+r.error.message  
    );  
  
  }  
  
  
  const was =  
  !!editingId;  
  
  
  editingId = null;  
  
  clearForm();  
  
  await load();  
  
  
  msg(  
    "saveMsg",  
    was  
    ? "记录已更新 ☁️"  
    : "记录已保存到云端 ☁️"  
  );  
  
}

/* 删除 */

    !confirm(  
      "确定删除这条记录吗？"

/* 日期 */  
function uniqueDates(){  
  
  return [  
    ...new Set(  
      entries  
      .map(e => e.date)  
      .filter(Boolean)  
    )  
  ].sort();  
  
}  
  
  
/* 连续天数 */  
function calcStreak(){  
  
  const ds =  
  new Set(  
    uniqueDates()  
  );  
  
  let d =  
  new Date();  
  
  d.setHours(  
    0,0,0,0  
  );  
  
  let n = 0;  
  
  
  while(  
    ds.has(  
      d.toISOString()  
      .slice(0,10)  
    )  
  ){  
  
    n++;  
  
    d.setDate(  
      d.getDate()-1  
    );  
  
  }  
  
  
  return n;  
  
}

  entries.filter(

    String(  
      e.type || ""

  document  
  .getElementById("streak")

  calcStreak();  
  
}

function render(){  
  
  const q =  
  (search.value || "")  
  .toLowerCase();  
  
  
  const f =  
  (filter.value || "")  
  .trim();  
  
  
  const arr =  
  entries.filter(  
    e =>  
    (!f || e.type === f) &&  
    (  
      !q ||  
      [  
        e.title,  
        e.content,  
        e.lesson  
      ]  
      .join(" ")  
      .toLowerCase()  
      .includes(q)  
    )  
  );  
  
  
  list.innerHTML =  
  arr.length  
  
  ?  
  
  arr.map(e => `  
  
    <div class="entry">  
  
      <b>  
        ${esc(e.title)}  
      </b>  
  
      <span class="small">  
        ${e.date}  
        ·  
        ${esc(e.type)}  
        ·  
        ${esc(e.mood || "")}  
        ·  
        ${esc(e.score || "")}  
      </span>  
  
      <p>  
        ${esc(  
          e.content || ""  
        ).replace(  
          /\n/g,  
          "<br>"  
        )}  
      </p>  
  
      ${  
        e.lesson  
        ?  
        `<p>  
          💭 ${esc(e.lesson)}  
        </p>`  
        :  
        ""  
      }  
  
      ${  
        (e.photos || []).length  
        ?  
        `<div class="photo-grid">  
  
          ${e.photos.map(x => `  
  
            <img  
              src="${esc(x)}"  
              alt="记录照片"  
              loading="lazy"  
            >  
  
          `).join("")}  
  
        </div>`  
        :  
        ""  
      }  
  
      <div class="row">  
  
        <button  
          onclick="editEntry(${e.id})"  
        >  
          编辑  
        </button>  
  
        <button  
          class="danger"  
          onclick="delEntry(${e.id})"  
        >  
          删除  
        </button>  
  
      </div>  
  
    </div>  
  
  `).join("")  
  
  :  
  
  "<p class='small'>还没有记录，写下第一篇吧 ✨</p>";  
  
  
  updateStats();  
  
}  
  
  
/* 照片预览 */  
document  
.getElementById("photos")  
.addEventListener(  
  "change",  
  e => {  
  
    document  
    .getElementById("photoPreview")  
    .innerHTML =  
  
    [  
      ...e.target.files  
    ]  
    .map(  
      f =>  
      `<img  
        src="${URL.createObjectURL(f)}"  
        alt="预览"  
      >`  
    )  
    .join("");  
  
  }  
);  
  
  
/* 防止HTML注入 */  
function esc(s){  
  
  return String(  
    s ?? ""  
  ).replace(  
    /[&<>"']/g,  
    c =>  
    ({  
      "&":"&amp;",  
      "<":"&lt;",  
      ">":"&gt;",  
      '"':"&quot;",  
      "'":"&#39;"  
    }[c])  
  );  
  
}
