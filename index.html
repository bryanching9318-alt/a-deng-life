<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1d4ed8">
<title>A等生活 · 助教日记</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Microsoft YaHei",sans-serif;
    background:#f4f6fb;
    color:#182033;
}

.app{
    max-width:760px;
    margin:auto;
    padding:14px;
    padding-bottom:80px;
}

.hero{
    background:linear-gradient(135deg,#ffffff,#edf2ff);
    border-radius:26px;
    padding:25px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

h1{
    margin:0 0 6px;
    font-size:28px;
}

.sub{
    color:#697386;
    font-size:14px;
}

.quote{
    margin-top:18px;
    font-size:18px;
    font-weight:bold;
}

.account{
    margin:12px 0;
    padding:13px;
    background:white;
    border-radius:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.account-status{
    color:#667085;
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:white;
    border-radius:16px;
    padding:13px 5px;
    text-align:center;
}

.num{
    font-size:22px;
    font-weight:bold;
}

.stat small{
    color:#667085;
}

.goal{
    margin:12px 0;
    padding:15px;
    background:white;
    border-radius:18px;
}

.goalline{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    font-size:13px;
}

.bar{
    height:9px;
    background:#e8edf7;
    border-radius:99px;
    overflow:hidden;
    margin-top:9px;
}

.bar i{
    display:block;
    height:100%;
    background:#1d4ed8;
    width:0;
}

.tabs{
    display:flex;
    gap:8px;
    overflow:auto;
    margin:12px 0;
}

.tab{
    border:0;
    background:white;
    padding:11px 15px;
    border-radius:14px;
    font-weight:bold;
    white-space:nowrap;
}

.tab.active{
    background:#1d4ed8;
    color:white;
}

.card{
    background:white;
    border-radius:20px;
    padding:18px;
    margin:12px 0;
}

label{
    display:block;
    font-weight:bold;
    margin:13px 0 7px;
    font-size:14px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #dfe4ee;
    border-radius:12px;
    background:#fbfcfe;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.btn{
    border:0;
    border-radius:13px;
    padding:11px 14px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#1d4ed8;
    color:white;
}

.soft{
    background:#eef2ff;
    color:#1e40af;
}

.danger{
    background:#fee2e2;
    color:#991b1b;
}

.smallbtn{
    border:0;
    border-radius:12px;
    padding:9px 12px;
    background:#eef2ff;
    font-weight:bold;
}

.entry{
    border:1px solid #e7eaf0;
    border-radius:17px;
    padding:14px;
    margin:10px 0;
}

.entry h3{
    margin:7px 0;
}

.meta{
    color:#778195;
    font-size:12px;
}

.tag{
    display:inline-block;
    background:#eef2ff;
    color:#3730a3;
    border-radius:999px;
    padding:4px 9px;
    font-size:12px;
}

.photo-preview{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.photo-preview img{
    width:140px;
    height:100px;
    object-fit:cover;
    border-radius:14px;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:10px;
}

.photo-grid img{
    width:100%;
    height:100px;
    object-fit:cover;
    border-radius:10px;
}

.filters{
    display:grid;
    grid-template-columns:1fr 150px;
    gap:8px;
    margin:10px 0;
}

.empty{
    text-align:center;
    color:#8992a4;
    padding:30px 10px;
}

.note{
    color:#8992a4;
    font-size:12px;
    margin-top:8px;
}

.download{
    background:#eef2ff;
    border-radius:18px;
    padding:17px;
}

.download h3{
    margin-top:0;
}

.apk{
    display:inline-block;
    background:#111827;
    color:white;
    text-decoration:none;
    padding:11px 14px;
    border-radius:13px;
    font-weight:bold;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:99;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(420px,100%);
    background:white;
    border-radius:24px;
    padding:22px;
}

.modal-card input{
    margin:7px 0 12px;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
}

.auth-note{
    font-size:12px;
    color:#777;
    line-height:1.5;
}

@media(max-width:520px){

    .row{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- 顶部 -->
<section class="hero">

<h1>🌟 A等生活 · 助教日记</h1>

<div class="sub">
记录每一天的努力、成长与助教时光
</div>

<div class="quote" id="quote"></div>

</section>

<!-- 登录 -->
<div class="account">

<div class="account-status" id="accountStatus">
未登录
</div>

<button
class="smallbtn"
id="authBtn"
onclick="openAuth()">
登录 / 注册
</button>

</div>

<!-- 数据统计 -->
<div class="stats">

<div class="stat">
<div class="num" id="count">0</div>
<small>总记录</small>
</div>

<div class="stat">
<div class="num" id="studyCount">0</div>
<small>A等生活</small>
</div>

<div class="stat">
<div class="num" id="taCount">0</div>
<small>助教记录</small>
</div>

<div class="stat">
<div class="num" id="streak">0</div>
<small>连续天数</small>
</div>

</div>

<!-- 月目标 -->
<div class="goal">

<div class="goalline">
<span>🎯 本月目标</span>
<span id="goalText">0 / 20 天</span>
</div>

<div class="bar">
<i id="goalBar"></i>
</div>

</div>

<!-- 页面按钮 -->
<div class="tabs">

<button
class="tab active"
onclick="showTab('new',this)">
✍️ 写记录
</button>

<button
class="tab"
onclick="showTab('list',this)">
📖 我的记录
</button>

<button
class="tab"
onclick="showTab('backup',this)">
💾 保存/下载
</button>

</div>


<!-- 写记录 -->
<section id="new" class="card">

<h2 id="formTitle">
写下今天
</h2>

<div class="row">

<div>

<label>日期</label>

<input
id="date"
type="date">

</div>

<div>

<label>类型</label>

<select id="type">

<option>A等生活</option>

<option>助教生活</option>

<option>A等生活 + 助教</option>

</select>

</div>

</div>


<label>标题</label>

<input
id="title"
placeholder="例如：今天又进步了一点">


<label>今天做了什么？</label>

<textarea
id="content"
placeholder="学习、目标、助教工作、和学生的互动……">
</textarea>


<div class="row">

<div>

<label>今日心情</label>

<select id="mood">

<option>😊 很棒</option>
<option>🙂 不错</option>
<option>😐 普通</option>
<option>😮‍💨 有点累</option>
<option>💪 继续坚持</option>

</select>

</div>


<div>

<label>今日评分</label>

<select id="score">

<option>5 ⭐</option>
<option>4 ⭐</option>
<option>3 ⭐</option>
<option>2 ⭐</option>
<option>1 ⭐</option>

</select>

</div>

</div>


<label>
今天的收获 / 给自己的话
</label>

<textarea
id="lesson"
placeholder="今天学到了什么？想对未来的自己说什么？">
</textarea>


<label>
📸 今天的照片
</label>

<input
id="photo"
type="file"
accept="image/*"
multiple
onchange="previewPhotos(event)">

<div
class="photo-preview"
id="photoPreview">
</div>

<div class="note">
照片只保存在这台手机/浏览器里，不会上传服务器。
</div>


<div class="actions">

<button
class="btn primary"
id="saveBtn"
onclick="saveEntry()">
💾 保存今天的记录
</button>

<button
class="btn soft"
onclick="clearForm()">
清空
</button>

<button
class="btn danger"
id="cancelBtn"
onclick="cancelEdit()"
style="display:none">
取消编辑
</button>

</div>

</section>


<!-- 记录列表 -->
<section
id="list"
class="card"
style="display:none">

<h2>
📖 我的记录
</h2>

<div class="filters">

<input
id="search"
placeholder="搜索标题、内容、收获……"
oninput="render()">

<select
id="filter"
onchange="render()">

<option value="全部">
全部类型
</option>

<option>
A等生活
</option>

<option>
助教生活
</option>

<option>
A等生活 + 助教
</option>

</select>

</div>

<div id="entries"></div>

</section>


<!-- 备份 -->
<section
id="backup"
class="card"
style="display:none">

<h2>
💾 保存与下载
</h2>

<div class="download">

<h3>
📱 Android APK
</h3>

<p>
以后制作好的 APK 可以从这里下载安装。
</p>

<a
class="apk"
href="https://github.com/bryanching9318-alt/a-deng-life-apk/releases/latest"
target="_blank">
⬇️ APK 下载页面
</a>

</div>


<p>
这个版本是<strong>手机本机版</strong>。
</p>

<p>
换手机之前，请先导出备份。
</p>


<div class="actions">

<button
class="btn primary"
onclick="downloadJSON()">
⬇️ 下载完整备份
</button>

<button
class="btn soft"
onclick="downloadTXT()">
📄 下载文字版
</button>

<label
class="btn soft"
style="display:inline-block">

📤 导入备份

<input
id="importFile"
type="file"
accept=".json"
onchange="importJSON(event)"
style="display:none">

</label>

<button
class="btn danger"
onclick="deleteAll()">
删除全部记录
</button>

</div>

</section>

</div>


<!-- 登录窗口 -->
<div
class="modal"
id="authModal">

<div class="modal-card">

<h2 id="authTitle">
👤 登录账户
</h2>

<p class="auth-note">
这个版本不需要数据库。账户、日记和照片都保存在当前手机浏览器中。
</p>

<input
id="authName"
placeholder="用户名">

<input
id="authPass"
type="password"
placeholder="密码">


<div class="modal-actions">

<button
class="btn soft"
onclick="closeAuth()">
取消
</button>

<button
class="btn primary"
onclick="submitAuth()"
id="authSubmit">
登录
</button>

</div>


<p style="text-align:center">

<button
class="smallbtn"
onclick="toggleAuthMode()"
id="authToggle">

没有账户？注册

</button>

</p>

</div>

</div>


<script>

/* =========================
   基本设置
========================= */

const KEY =
'a等生活助教日记_v2';

const USERS =
'a等生活账户_v2';

let currentUser =
localStorage.getItem(
'a等生活当前账户_v2'
) || '';

let authMode =
'login';

let entries = [];

let editingId = null;


/* 简化选择器 */

const $ =
id => document.getElementById(id);


/* =========================
   25句励志语录
========================= */

const quotes = [

"今天的努力，会成为明天的底气。",

"慢一点没关系，重要的是一直向前。",

"把小事做好，就是A等生活。",

"认真生活，认真学习，认真做好每一次助教。",

"你今天的坚持，正在悄悄改变未来。",

"真正的成长，是每天比昨天更认真一点。",

"不要害怕走得慢，只要你没有停下来。",

"优秀不是天生的，是一次次坚持换来的。",

"今天多努力一点，未来就多一份选择。",

"你认真走过的每一步，都算数。",

"累的时候可以休息，但不要轻易放弃。",

"把今天过好，就是对未来最好的负责。",

"没有白费的努力，只有还没到时候的收获。",

"相信自己，你比想象中更有潜力。",

"先完成，再完美；先行动，再进步。",

"真正厉害的人，是把平凡的日子过得认真。",

"每一次坚持，都是在给未来的自己加分。",

"困难不会一直存在，坚持会让你越来越强。",

"别羡慕别人的起点，走好自己的路。",

"今天的你，正在成为明天更好的你。",

"学习不是为了证明给别人看，而是为了拥有更多可能。",

"愿你眼里有光，心里有方向，脚下有力量。",

"做一个自律的人，也做一个温柔的人。",

"把目标放在心里，把行动放在每天。",

"当你觉得坚持很难的时候，说明你正在成长。"

];

$('quote').textContent =
quotes[new Date().getDate() % quotes.length];


/* =========================
   用户系统
========================= */

function getUsers(){

    try{

        return JSON.parse(
            localStorage.getItem(USERS) || '{}'
        );

    }catch(e){

        return {};

    }

}


function userKey(){

    return currentUser
        ? KEY + '_' + currentUser
        : KEY;

}


function loadEntries(){

    try{

        entries =
            JSON.parse(
                localStorage.getItem(
                    userKey()
                ) || '[]'
            );

        if(!Array.isArray(entries)){
            entries=[];
        }

    }catch(e){

        entries=[];

    }

}


function save(){

    localStorage.setItem(
        userKey(),
        JSON.stringify(entries)
    );

    updateStats();
    render();

}


function updateAccountUI(){

    $('accountStatus').textContent =
        currentUser
        ? '👤 已登录：' + currentUser
        : '未登录';


    $('authBtn').textContent =
        currentUser
        ? '退出账户'
        : '登录 / 注册';


    $('authBtn').onclick =
        currentUser
        ? logout
        : openAuth;

}


function openAuth(){

    $('authModal')
        .classList.add('show');

    $('authName').value =
        currentUser;

    $('authPass').value='';

}


function closeAuth(){

    $('authModal')
        .classList.remove('show');

}


function toggleAuthMode(){

    authMode =
        authMode === 'login'
        ? 'register'
        : 'login';


    $('authTitle').textContent =
        authMode === 'login'
        ? '👤 登录账户'
        : '🆕 注册账户';


    $('authSubmit').textContent =
        authMode === 'login'
        ? '登录'
        : '注册';


    $('authToggle').textContent =
        authMode === 'login'
        ? '没有账户？注册'
        : '已有账户？登录';

}


function submitAuth(){

    const name =
        $('authName')
        .value
        .trim();

    const pass =
        $('authPass').value;


    if(!name || !pass){

        alert(
            '请输入用户名和密码。'
        );

        return;

    }


    const users =
        getUsers();


    if(authMode === 'register'){

        if(users[name]){

            alert(
                '这个用户名已经注册。'
            );

            return;

        }


        users[name]={
            password:pass
        };


        localStorage.setItem(
            USERS,
            JSON.stringify(users)
        );


        currentUser=name;

        localStorage.setItem(
            'a等生活当前账户_v2',
            name
        );


        loadEntries();
        updateAccountUI();
        updateStats();
        render();

        closeAuth();

        alert(
            '注册成功！'
        );

    }else{

        if(
            !users[name] ||
            users[name].password !== pass
        ){

            alert(
                '用户名或密码不正确。'
            );

            return;

        }


        currentUser=name;

        localStorage.setItem(
            'a等生活当前账户_v2',
            name
        );


        loadEntries();
        updateAccountUI();
        updateStats();
        render();

        closeAuth();

        alert(
            '登录成功！'
        );

    }

}


function logout(){

    currentUser='';

    localStorage.removeItem(
        'a等生活当前账户_v2'
    );

    entries=[];

    updateAccountUI();
    updateStats();
    render();

    alert(
        '已退出账户。'
    );

}


/* =========================
   日期
========================= */

$('date').value =
new Date()
.toISOString()
.slice(0,10);


/* =========================
   图片
========================= */

function filesToDataURLs(files){

    return Promise.all(

        [...files].map(

            file =>

            new Promise(
                (resolve,reject)=>{

                    const reader =
                        new FileReader();

                    reader.onload =
                        () => resolve(
                            reader.result
                        );

                    reader.onerror =
                        reject;

                    reader.readAsDataURL(
                        file
                    );

                }

            )

        )

    );

}


function previewPhotos(event){

    const files =
        event.target.files || [];

    const box =
        $('photoPreview');

    box.innerHTML='';


    [...files].forEach(

        file => {

            const reader =
                new FileReader();

            reader.onload = () => {

                const img =
                    document.createElement(
                        'img'
                    );

                img.src =
                    reader.result;

                box.appendChild(img);

            };

            reader.readAsDataURL(file);

        }

    );

}


/* =========================
   保存记录
========================= */

async function saveEntry(){

    const files =
        $('photo').files || [];

    let photos=[];


    try{

        photos =
            await filesToDataURLs(
                files
            );

    }catch(e){

        alert(
            '照片读取失败，请重试。'
        );

        return;

    }


    const old =
        editingId
        ? entries.find(
            x => x.id === editingId
        )
        : null;


    const entry={

        id:
            editingId ||
            Date.now(),

        date:
            $('date').value,

        type:
            $('type').value,

        title:
            $('title').value.trim()
            || '今天的记录',

        content:
            $('content')
            .value
            .trim(),

        mood:
            $('mood').value,

        score:
            $('score').value,

        lesson:
            $('lesson')
            .value
            .trim(),

        photos:
            photos.length
            ? photos
            : (old?.photos || [])

    };


    if(
        !entry.content &&
        !entry.lesson &&
        !entry.photos.length
    ){

        alert(
            '请至少写一点今天的记录，或者添加照片。'
        );

        return;

    }


    if(editingId){

        const index =
            entries.findIndex(
                x =>
                x.id === editingId
            );

        if(index >= 0){

            entries[index]=entry;

        }

    }else{

        entries.unshift(entry);

    }


    save();

    cancelEdit();

    clearForm();

    alert(
        editingId
        ? '记录已更新！'
        : '记录已保存！'
    );

}


/* =========================
   清空表单
========================= */

function clearForm(){

    $('title').value='';

    $('content').value='';

    $('lesson').value='';

    $('mood').value=
        '😊 很棒';

    $('score').value=
        '5 ⭐';

    $('type').value=
        'A等生活';

    $('date').value=
        new Date()
        .toISOString()
        .slice(0,10);

    $('photo').value='';

    $('photoPreview').innerHTML='';

}


/* =========================
   页面切换
========================= */

function showTab(id,button){

    ['new','list','backup']
    .forEach(

        x => {

            $(x).style.display =
                x === id
                ? 'block'
                : 'none';

        }

    );


    document
        .querySelectorAll('.tab')
        .forEach(
            x =>
            x.classList.remove(
                'active'
            )
        );


    if(button){

        button.classList.add(
            'active'
        );

    }


    if(id === 'list'){

        render();

    }

}


/* =========================
   防止HTML注入
========================= */

function esc(text){

    return String(
        text ?? ''
    ).replace(
        /[&<>"']/g,
        char => ({

            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'

        }[char])

    );

}


/* =========================
   显示记录
========================= */

function render(){

    const search =
        (
            $('search')?.value
            || ''
        )
        .toLowerCase();


    const filter =
        $('filter')?.value
        || '全部';


    const list =
        entries.filter(

            entry =>

            (
                filter === '全部'
                ||
                entry.type === filter
            )

            &&

            (
                (
                    entry.title
                    + ' '
                    + entry.content
                    + ' '
                    + entry.lesson
                    + ' '
                    + entry.type
                )
                .toLowerCase()
                .includes(search)
            )

        );


    const box =
        $('entries');


    if(!list.length){

        box.innerHTML =
            '<div class="empty">' +
            '还没有符合条件的记录。<br>' +
            '写下你的第一篇吧 ✨' +
            '</div>';

        return;

    }


    box.innerHTML =
        list.map(

            entry => `

            <article class="entry">

                <div class="meta">
                    📅 ${esc(entry.date)}
                    · ${esc(entry.type)}
                    · ${esc(entry.mood)}
                </div>

                <h3>
                    ${esc(entry.title)}
                </h3>

                <span class="tag">
                    ${esc(entry.score)}
                </span>

                <p>
                    ${esc(entry.content)
                        .replace(/\n/g,'<br>')}
                </p>

                ${
                    entry.lesson
                    ?
                    `<p>
                    <b>💡 收获：</b>
                    ${esc(entry.lesson)
                        .replace(/\n/g,'<br>')}
                    </p>`
                    :
                    ''
                }

                ${
                    (entry.photos || []).length
                    ?
                    `
                    <div class="photo-grid">

                    ${
                        entry.photos
                        .map(
                            photo =>
                            `
                            <img
                                src="${photo}"
                                alt="记录照片">
                            `
                        )
                        .join('')
                    }

                    </div>
                    `
                    :
                    ''
                }

                <div class="actions">

                    <button
                    class="btn soft"
                    onclick="editEntry('${entry.id}')">
                    ✏️ 编辑
                    </button>

                    <button
                    class="btn danger"
                    onclick="removeEntry('${entry.id}')">
                    🗑️ 删除
                    </button>

                </div>

            </article>

            `

        )
        .join('');

}


/* =========================
   编辑
========================= */

function editEntry(id){

    const entry =
        entries.find(
            x =>
            String(x.id) ===
            String(id)
        );


    if(!entry)return;


    editingId =
        entry.id;


    $('date').value =
        entry.date;

    $('type').value =
        entry.type;

    $('title').value =
        entry.title;

    $('content').value =
        entry.content;

    $('mood').value =
        entry.mood;

    $('score').value =
        entry.score;

    $('lesson').value =
        entry.lesson;


    $('photo').value='';


    $('photoPreview').innerHTML =
        (entry.photos || [])
        .map(
            photo =>
            `<img src="${photo}">`
        )
        .join('');


    $('formTitle').textContent =
        '✏️ 编辑记录';

    $('saveBtn').textContent =
        '💾 更新记录';

    $('cancelBtn').style.display =
        'inline-block';


    showTab(
        'new',
        document.querySelectorAll('.tab')[0]
    );


    window.scrollTo({
        top:0,
        behavior:'smooth'
    });

}


function cancelEdit(){

    editingId=null;

    $('formTitle').textContent =
        '写下今天';

    $('saveBtn').textContent =
        '💾 保存今天的记录';

    $('cancelBtn').style.display =
        'none';

}


/* =========================
   删除
========================= */

function removeEntry(id){

    if(
        !confirm(
            '确定删除这条记录吗？'
        )
    )return;


    entries =
        entries.filter(
            entry =>
            String(entry.id) !==
            String(id)
        );


    save();

}


/* =========================
   连续天数
========================= */

function calcStreak(){

    const dates =
        new Set(
            entries
            .map(
                entry => entry.date
            )
            .filter(Boolean)
        );


    let date =
        new Date();

    date.setHours(
        0,0,0,0
    );


    let streak=0;


    while(
        dates.has(
            date
            .toISOString()
            .slice(0,10)
        )
    ){

        streak++;

        date.setDate(
            date.getDate()-1
        );

    }


    return streak;

}


/* =========================
   统计
========================= */

function updateStats(){

    $('count').textContent =
        entries.length;


    $('studyCount').textContent =
        entries.filter(
            entry =>
            entry.type.includes(
                'A等'
            )
        ).length;


    $('taCount').textContent =
        entries.filter(
            entry =>
            entry.type.includes(
                '助教'
            )
        ).length;


    $('streak').textContent =
        calcStreak();


    const now =
        new Date();

    const ym =
        now.toISOString()
        .slice(0,7);


    const days =
        new Set(

            entries
            .filter(
                entry =>
                String(entry.date)
                .slice(0,7)
                === ym
            )
            .map(
                entry =>
                entry.date
            )

        ).size;


    const goal=20;

    const percent =
        Math.min(
            100,
            days / goal * 100
        );


    $('goalText').textContent =
        `${days} / ${goal} 天`;

    $('goalBar').style.width =
        percent + '%';

}


/* =========================
   下载
========================= */

function downloadFile(
    blob,
    filename
){

    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement('a');

    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        () =>
        URL.revokeObjectURL(url),
        1000
    );

}


function downloadJSON(){

    const data =
        JSON.stringify(
            entries,
            null,
            2
        );


    downloadFile(

        new Blob(
            [data],
            {
                type:
                'application/json'
            }
        ),

        'A等生活-助教日记-备份.json'

    );

}


function downloadTXT(){

    let text =
        'A等生活 · 助教日记\n\n';


    text +=
        entries
        .map(

            entry =>

            `【${entry.date}】
标题：${entry.title}
类型：${entry.type}
心情：${entry.mood}
评分：${entry.score}

${entry.content}

💡 收获：
${entry.lesson}

📸 照片：
${(entry.photos || []).length} 张

--------------------
`

        )
        .join('\n');


    downloadFile(

        new Blob(
            [text],
            {
                type:
                'text/plain;charset=utf-8'
            }
        ),

        'A等生活-助教日记.txt'

    );

}


/* =========================
   导入
========================= */

function importJSON(event){

    const file =
        event.target
        .files?.[0];


    if(!file)return;


    const reader =
        new FileReader();


    reader.onload = () => {

        try{

            const data =
                JSON.parse(
                    reader.result
                );


            if(!Array.isArray(data)){

                throw new Error();

            }


            entries =
                [
                    ...data,
                    ...entries
                ];


            entries =
                entries.filter(

                    (entry,index,array) =>

                    array.findIndex(
                        x =>
                        String(x.id)
                        ===
                        String(entry.id)
                    )
                    === index

                );


            save();


            alert(
                '备份导入成功！'
            );


        }catch(e){

            alert(
                '备份文件格式不正确。'
            );

        }

    };


    reader.readAsText(file);

    event.target.value='';

}


/* =========================
   删除全部
========================= */

function deleteAll(){

    if(
        !confirm(
            '确定删除全部记录吗？\n\n建议先下载备份。'
        )
    )return;


    entries=[];

    save();

}


/* =========================
   启动
========================= */

loadEntries();

updateAccountUI();

updateStats();

render();

</script>
