<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<title>A等生活 · 助教日记</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f4f6fb;
  color:#182033;
}
.app{
  max-width:760px;
  margin:auto;
  padding:12px 14px 70px;
}
.hero{
  background:linear-gradient(135deg,#fff,#edf2ff);
  border-radius:26px;
  padding:24px 20px;
  margin-bottom:12px;
  box-shadow:0 10px 30px #0000000d;
}
h1{margin:0 0 5px;font-size:28px}
.sub{color:#697386;font-size:14px}
.quote{
  margin-top:16px;
  font-size:18px;
  font-weight:800;
  line-height:1.5;
}
.quote-btn{
  margin-top:10px;
  border:0;
  background:#fff;
  color:#1d4ed8;
  border-radius:12px;
  padding:8px 12px;
  font-weight:800;
}
.account{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:12px 0;
  padding:12px 14px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 5px 20px #0000000d;
}
.account-status{
  font-size:13px;
  font-weight:800;
  word-break:break-all;
}
.account-status span{color:#64748b}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.stat{
  background:#fff;
  border-radius:15px;
  padding:12px 5px;
  text-align:center;
  box-shadow:0 5px 18px #00000008;
}
.num{font-size:21px;font-weight:900}
.stat small{font-size:11px;color:#667085}

.goal{
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin:12px 0;
  box-shadow:0 5px 18px #00000008;
}
.goalline{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:800;
}
.bar{
  height:9px;
  background:#e8edf7;
  border-radius:99px;
  overflow:hidden;
  margin-top:9px;
}
.bar i{
  display:block;
  height:100%;
  background:#1d4ed8;
  border-radius:99px;
  width:0;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin:12px 0;
}
.tab{
  border:0;
  background:#fff;
  padding:11px 14px;
  border-radius:14px;
  font-weight:800;
  white-space:nowrap;
}
.tab.active{
  background:#1d4ed8;
  color:#fff;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 6px 22px #0000000a;
}
label{
  display:block;
  font-weight:750;
  margin:12px 0 7px;
  font-size:14px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #dfe4ee;
  border-radius:12px;
  font:inherit;
  background:#fbfcfe;
  outline:none;
}
input:focus,textarea:focus,select:focus{
  border-color:#7aa0ff;
}
textarea{
  min-height:110px;
  resize:vertical;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.btn{
  border:0;
  border-radius:13px;
  padding:11px 14px;
  font-weight:800;
  cursor:pointer;
}
.primary{
  background:#1d4ed8;
  color:#fff;
}
.soft{
  background:#eef2ff;
  color:#1e40af;
}
.danger{
  background:#fee2e2;
  color:#991b1b;
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}
.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.entry{
  border:1px solid #e7eaf0;
  border-radius:17px;
  padding:14px;
  margin:10px 0;
  background:#fff;
}
.entry h3{margin:6px 0}
.meta{
  font-size:12px;
  color:#778195;
}
.tag{
  display:inline-block;
  background:#eef2ff;
  color:#3730a3;
  border-radius:999px;
  padding:4px 8px;
  font-size:12px;
  margin:2px;
}
.empty{
  text-align:center;
  color:#8992a4;
  padding:28px;
}
.filters{
  display:grid;
  grid-template-columns:1fr 150px;
  gap:8px;
  margin:10px 0;
}
.photo-preview,
.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}
.photo-preview img,
.photo-grid img{
  width:100%;
  height:105px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #e5e7eb;
}
.note{
  font-size:12px;
  color:#8992a4;
  margin-top:9px;
  line-height:1.5;
}
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:99;
}
.modal.show{display:flex}
.modal-card{
  width:min(420px,100%);
  background:#fff;
  border-radius:24px;
  padding:22px;
  box-shadow:0 20px 60px #0004;
}
.modal-card input{margin:7px 0 12px}
.modal-actions{
  display:flex;
  gap:10px;
}
.modal-actions button{flex:1}
.auth-note{
  font-size:12px;
  color:#777;
  line-height:1.5;
}
.switch{
  border:0;
  background:none;
  color:#1d4ed8;
  font-weight:800;
}
.loading{
  text-align:center;
  padding:18px;
  color:#64748b;
}

@media(max-width:520px){
  .row{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr}
  .app{padding-top:8px}
}
</style>
</head>

<body>

<div class="app">

<section class="hero">

<h1>🌟 A等生活 · 助教日记</h1>

<div class="sub">
记录每一天的努力、成长与助教时光
</div>

<div class="quote" id="quote"></div>

<button class="quote-btn" onclick="randomQuote()">
🔄 再来一句
</button>

</section>


<div class="account">

<div class="account-status" id="accountStatus">
☁️ 未登录
</div>

<button
class="btn soft"
id="accountBtn"
onclick="openAuth()">
登录 / 注册
</button>

</div>


<div class="stats">

<div class="stat">
<div class="num" id="count">0</div>
<small>总记录</small>
</div>

<div class="stat">
<div class="num" id="studyCount">0</div>
<small>A等生活</small>
</div>

<div class="stat">
<div class="num" id="taCount">0</div>
<small>助教记录</small>
</div>

<div class="stat">
<div class="num" id="streak">0</div>
<small>连续天数</small>
</div>

</div>


<div class="goal">

<div class="goalline">
<span>🎯 本月目标</span>
<span id="goalText">0 / 20 天</span>
</div>

<div class="bar">
<i id="goalBar"></i>
</div>

</div>


<div class="tabs">

<button
class="tab active"
onclick="showTab('new',this)">
✍️ 写记录
</button>

<button
class="tab"
onclick="showTab('list',this)">
📖 我的记录
</button>

</div>


<section id="new" class="card">

<h2 id="formTitle">写下今天</h2>


<div class="row">

<div>
<label>日期</label>
<input id="date" type="date">
</div>

<div>
<label>类型</label>

<select id="type">

<option>A等生活</option>

<option>助教生活</option>

<option>A等生活 + 助教</option>

</select>

</div>

</div>


<label>标题</label>

<input
id="title"
placeholder="例如：今天又进步了一点"
>


<label>今天做了什么？</label>

<textarea
id="content"
placeholder="学习、目标、助教工作、和学生的互动……">
</textarea>


<div class="row">

<div>

<label>今日心情</label>

<select id="mood">

<option>😊 很棒</option>
<option>🙂 不错</option>
<option>😐 普通</option>
<option>😮‍💨 有点累</option>
<option>💪 继续坚持</option>

</select>

</div>


<div>

<label>今日评分</label>

<select id="score">

<option>5 ⭐</option>
<option>4 ⭐</option>
<option>3 ⭐</option>
<option>2 ⭐</option>
<option>1 ⭐</option>

</select>

</div>

</div>


<label>今天的收获 / 给自己的话</label>

<textarea
id="lesson"
placeholder="今天学到了什么？想对未来的自己说什么？">
</textarea>


<label>📸 今天的照片</label>

<input
id="photo"
type="file"
accept="image/*"
multiple
onchange="previewPhotos(event)"
>


<div
class="photo-preview"
id="photoPreview">
</div>


<div class="note">
照片会直接上传到云端，不保存为本机日记数据。
</div>


<div class="actions">

<button
class="btn primary"
id="saveBtn"
onclick="saveEntry()">
☁️ 保存到云端
</button>

<button
class="btn soft"
onclick="clearForm()">
清空
</button>

<button
class="btn danger"
id="cancelBtn"
onclick="cancelEdit()"
style="display:none">
取消编辑
</button>

</div>

</section>


<section
id="list"
class="card"
style="display:none">

<h2>📖 我的记录</h2>


<div class="filters">

<input
id="search"
placeholder="搜索标题、内容、收获……"
oninput="render()"
>

<select
id="filter"
onchange="render()">

<option value="全部">全部类型</option>

<option>A等生活</option>

<option>助教生活</option>

<option>A等生活 + 助教</option>

</select>

</div>


<div id="entries">

<div class="empty">
请先登录云端账户。
</div>

</div>

</section>

</div>


<div class="modal" id="authModal">

<div class="modal-card">

<h2 id="authTitle">
👤 登录账户
</h2>

<p class="auth-note" id="authMsg">
登录后，日记和照片会保存到你的云端账户，换设备登录也能继续查看。
</p>


<input
id="authUser"
type="email"
placeholder="邮箱"
>


<input
id="authPass"
type="password"
placeholder="密码"
>


<div class="modal-actions">

<button
class="btn soft"
onclick="closeAuth()">
取消
</button>

<button
class="btn primary"
onclick="submitAuth()"
id="authSubmit">
登录
</button>

</div>


<p style="text-align:center;margin:14px 0 0">

<button
class="switch"
onclick="toggleAuthMode()"
id="authSwitch">
没有账户？点击注册
</button>

</p>

</div>

</div>


<script>

/* ================================
   SUPABASE 云端设置
================================ */

const SUPABASE_URL =
"https://covnjgtdwpsothkcasls.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MsamuvgocYfdrm_BbpXiAw_Bw6F48Z1";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const CLOUD_TABLE =
"diary_entries";

const CLOUD_BUCKET =
"diary-photos";


/* ================================
   状态
================================ */

let cloudUser = null;

let entries = [];

let editingId = null;

let authMode = "login";


/* ================================
   励志语录
================================ */

const quotes = [

"今天的努力，会成为明天的底气。",

"慢一点没关系，重要的是一直向前。",

"把小事做好，就是A等生活。",

"认真生活，认真学习，认真做好每一次助教。",

"你今天的坚持，正在悄悄改变未来。",

"真正的成长，是每天比昨天更认真一点。",

"不要害怕走得慢，只要你没有停下来。",

"优秀不是天生的，是一次次坚持换来的。",

"今天多努力一点，未来就多一份选择。",

"你认真走过的每一步，都算数。",

"累的时候可以休息，但不要轻易放弃。",

"把今天过好，就是对未来最好的负责。",

"没有白费的努力，只有还没到时候的收获。",

"相信自己，你比想象中更有潜力。",

"先完成，再完美；先行动，再进步。",

"真正厉害的人，是把平凡的日子过得认真。",

"每一次坚持，都是在给未来的自己加分。",

"困难不会一直存在，坚持会让你越来越强。",

"别羡慕别人的起点，走好自己的路。",

"今天的你，正在成为明天更好的你。",

"学习不是为了证明给别人看，而是为了拥有更多可能。",

"愿你眼里有光，心里有方向，脚下有力量。",

"做一个自律的人，也做一个温柔的人。",

"把目标放在心里，把行动放在每天。",

"当你觉得坚持很难的时候，说明你正在成长。"

];


function randomIndex(max){

if(window.crypto &&
crypto.getRandomValues){

const a =
new Uint32Array(1);

crypto.getRandomValues(a);

return a[0] % max;

}

return Math.floor(
Math.random() * max
);

}


function randomQuote(){

document.getElementById("quote")
.textContent =
quotes[randomIndex(quotes.length)];

}


/* ================================
   基础
================================ */

const $ = id =>
document.getElementById(id);


function today(){

const d = new Date();

d.setMinutes(
d.getMinutes() -
d.getTimezoneOffset()
);

return d.toISOString().slice(0,10);

}


$("date").value = today();

randomQuote();


/* ================================
   登录
================================ */

function openAuth(){

$("authModal")
.classList.add("show");

$("authUser").value =
cloudUser?.email || "";

$("authPass").value = "";

}


function closeAuth(){

$("authModal")
.classList.remove("show");

}


function toggleAuthMode(){

authMode =
authMode === "login"
? "register"
: "login";


$("authTitle").textContent =
authMode === "login"
? "👤 登录账户"
: "🆕 注册账户";


$("authSubmit").textContent =
authMode === "login"
? "登录"
: "注册";


$("authSwitch").textContent =
authMode === "login"
? "没有账户？点击注册"
: "已有账户？点击登录";


$("authMsg").textContent =
authMode === "login"
? "登录后，日记和照片会保存到你的云端账户，换设备登录也能继续查看。"
: "注册一个云端账户，你的日记和照片将与账户绑定。";

}


async function submitAuth(){

const email =
$("authUser").value.trim();

const password =
$("authPass").value;


if(!email || !password){

$("authMsg").textContent =
"请输入邮箱和密码。";

return;

}


if(password.length < 6){

$("authMsg").textContent =
"密码至少需要 6 位。";

return;

}


$("authSubmit").disabled = true;


try{

let result;


if(authMode === "register"){

result =
await sb.auth.signUp({
email,
password
});

}else{

result =
await sb.auth.signInWithPassword({
email,
password
});

}


if(result.error)
throw result.error;


if(
authMode === "register" &&
!result.data.session
){

$("authMsg").textContent =
"注册成功！如果系统要求邮箱验证，请先完成邮箱验证，再回来登录。";

return;

}


await refreshCloudSession();

closeAuth();

alert(
authMode === "login"
? "登录成功！"
: "注册成功！"
);


}catch(e){

$("authMsg").textContent =
e.message || "操作失败，请重试。";

}finally{

$("authSubmit").disabled = false;

}

}


/* ================================
   登出
================================ */

async function logout(){

await sb.auth.signOut();

cloudUser = null;

entries = [];

editingId = null;

updateAccountUI();

render();

updateStats();

clearForm();

}


function updateAccountUI(){

if(cloudUser){

$("accountStatus").innerHTML =
"☁️ 已登录：<span>" +
esc(cloudUser.email) +
"</span>";

$("accountBtn").textContent =
"退出账户";

$("accountBtn").onclick =
logout;

}else{

$("accountStatus").textContent =
"☁️ 未登录";

$("accountBtn").textContent =
"登录 / 注册";

$("accountBtn").onclick =
openAuth;

}

}


/* ================================
   获取登录状态
================================ */

async function refreshCloudSession(){

const {data} =
await sb.auth.getSession();

cloudUser =
data.session?.user || null;

updateAccountUI();


if(cloudUser){

await loadCloudEntries();

}else{

entries = [];

render();

updateStats();

}

}


/* ================================
   上传照片
================================ */

async function uploadPhoto(file,userId){

const ext =
(
file.name?.split(".").pop()
|| "jpg"
)
.replace(/[^a-z0-9]/gi,"")
.toLowerCase()
|| "jpg";


const path =
userId +
"/" +
crypto.randomUUID() +
"." +
ext;


const {error} =
await sb.storage
.from(CLOUD_BUCKET)
.upload(
path,
file,
{
contentType:
file.type ||
"image/jpeg",

upsert:false
}
);


if(error)
throw error;


return path;

}


/* ================================
   获取照片临时地址
================================ */

async function signedPhoto(path){

const {data,error} =
await sb.storage
.from(CLOUD_BUCKET)
.createSignedUrl(
path,
3600
);


if(error)
throw error;


return data.signedUrl;

}


/* ================================
   读取云端日记
================================ */

async function loadCloudEntries(){

if(!cloudUser)
return;


$("entries").innerHTML =
'<div class="loading">☁️ 正在读取你的云端记录…</div>';


const {data,error} =
await sb
.from(CLOUD_TABLE)
.select("*")
.eq("user_id",cloudUser.id)
.order("date",{ascending:false})
.order("created_at",{ascending:false});


if(error){

$("entries").innerHTML =
'<div class="empty">读取云端记录失败：' +
esc(error.message) +
"</div>";

return;

}


entries = [];


for(
const x of (data || [])
){

const photos = [];


for(
const path of (x.photos || [])
){

try{

photos.push({
path,
url:
await signedPhoto(path)
});

}catch(e){}

}


entries.push({

id:x.id,

date:x.date,

type:x.type,

title:x.title,

content:x.content,

mood:x.mood,

score:x.score,

lesson:x.lesson,

photos

});

}


render();

updateStats();

}


/* ================================
   保存
================================ */

async function saveEntry(){

if(!cloudUser){

openAuth();

return;

}


const files =
[
...($("photo").files || [])
];


const old =
editingId
?
entries.find(
x =>
String(x.id) ===
String(editingId)
)
: null;


const e = {

date:$("date").value,

type:$("type").value,

title:
$("title").value.trim()
|| "今天的记录",

content:
$("content").value.trim(),

mood:
$("mood").value,

score:
$("score").value,

lesson:
$("lesson").value.trim()

};


if(
!e.content &&
!e.lesson &&
!files.length &&
(old?.photos || []).length === 0
){

alert(
"请至少写一点今天的记录或添加照片。"
);

return;

}


const btn = $("saveBtn");

btn.disabled = true;

btn.textContent =
"☁️ 正在保存…";


const wasEditing =
!!editingId;


try{

const photoPaths =
(old?.photos || [])
.map(x => x.path)
.filter(Boolean);


for(
const f of files
){

photoPaths.push(
await uploadPhoto(
f,
cloudUser.id
)
);

}


const payload = {

...e,

user_id:
cloudUser.id,

photos:
photoPaths

};


let error;


if(editingId){

({
error
} =
await sb
.from(CLOUD_TABLE)
.update(payload)
.eq("id",editingId)
.eq("user_id",cloudUser.id)
);

}else{

({
error
} =
await sb
.from(CLOUD_TABLE)
.insert(payload)
);

}


if(error)
throw error;


await loadCloudEntries();

cancelEdit();

clearForm();


alert(
wasEditing
? "已更新并同步到云端！"
: "已保存并同步到云端！"
);


showTab(
"list",
document.querySelectorAll(".tab")[1]
);


}catch(e){

alert(
"保存失败：" +
(e.message || e)
);

}finally{

btn.disabled = false;

btn.textContent =
wasEditing
? "💾 更新记录"
: "☁️ 保存到云端";

}

}


/* ================================
   照片预览
================================ */

function previewPhotos(ev){

const files =
ev.target.files || [];

const box =
$("photoPreview");

[

].forEach(f => {

/* ================================
   清空表单
================================ */

"写下今天";

"☁️ 保存到云端";

$("content").value = "";

$("lesson").value = "";

/* ================================
   编辑
================================ */

function editEntry(id){

const e =
entries.find(
x =>
String(x.id) ===
String(id)
);


if(!e)
return;


editingId = e.id;

$("date").value =
e.date || today();

$("type").value =
e.type || "A等生活";

$("title").value =
e.title || "";

$("content").value =
e.content || "";

$("mood").value =
e.mood || "😊 很棒";

$("score").value =
e.score || "5 ⭐";

$("lesson").value =
e.lesson || "";

$("photo").value = "";


$("photoPreview").innerHTML =
(e.photos || [])
.filter(x => x.url)
.map(
x =>
`<img src="${x.url}" alt="已有照片">`
)
.join("");


$("formTitle").textContent =
"✏️ 编辑记录";

$("saveBtn").textContent =
"💾 更新记录";

$("cancelBtn").style.display =
"inline-block";


showTab(
"new",
document.querySelectorAll(".tab")[0]
);


window.scrollTo({
top:0,
behavior:"smooth"
});

}


function cancelEdit(){

editingId = null;

$("formTitle").textContent =
"写下今天";

$("saveBtn").textContent =
"☁️ 保存到云端";

$("cancelBtn").style.display =
"none";

}


/* ================================
   删除
================================ */

async function removeEntry(id){

if(
!cloudUser ||
!confirm(
"确定删除这条记录吗？删除后云端记录也会删除。"
)
)
return;


const e =
entries.find(
x =>
String(x.id) ===
String(id)
);


try{

const paths =
(e?.photos || [])
.map(x => x.path)
.filter(Boolean);


if(paths.length){

await sb.storage
.from(CLOUD_BUCKET)
.remove(paths);

}


const {error} =
await sb
.from(CLOUD_TABLE)
.delete()
.eq("id",id)
.eq("user_id",cloudUser.id);


if(error)
throw error;


await loadCloudEntries();


}catch(err){

alert(
"删除失败：" +
err.message
);

}

}


/* ================================
   页面切换
================================ */

function showTab(id,btn){

[
"new",
"list"
].forEach(x => {

$(x).style.display =
x === id
? "block"
: "none";

});


document
.querySelectorAll(".tab")
.forEach(x =>
x.classList.remove("active")
);


if(btn)
btn.classList.add("active");


if(id === "list")
render();

}


/* ================================
   显示记录
================================ */

function render(){

const box =
$("entries");


if(!cloudUser){

box.innerHTML =
'<div class="empty">请先登录云端账户，再查看你的记录。</div>';

return;

}


const q =
($("search")?.value || "")
.toLowerCase();


const f =
$("filter")?.value ||
"全部";


const arr =
entries.filter(e => {

const matchType =
f === "全部" ||
e.type === f;


const text =
[
e.title,
e.content,
e.lesson,
e.type,
e.mood
]
.join(" ")
.toLowerCase();


return (
matchType &&
text.includes(q)
);

});


if(!arr.length){

box.innerHTML =
'<div class="empty">还没有符合条件的记录。写下你的第一篇吧 ✨</div>';

return;

}


box.innerHTML =
arr.map(e => {

const photos =
(e.photos || [])
.filter(x => x.url)
.map(
x =>
`<img
src="${x.url}"
alt="记录照片"
loading="lazy"
onclick="window.open(this.src,'_blank')">`
)
.join("");


return `

<article class="entry">

<div class="meta">
📅 ${esc(e.date)}
· ${esc(e.type)}
· ${esc(e.mood)}
</div>

<h3>
${esc(e.title)}
</h3>

<span class="tag">
${esc(e.score)}
</span>

${
e.content
?
`<p>
${esc(e.content).replace(/\n/g,"<br>")}
</p>`
:""
}

${
e.lesson
?
`<p>
<b>💡 收获：</b>
${esc(e.lesson).replace(/\n/g,"<br>")}
</p>`
:""
}

${
photos
?
`<div class="photo-grid">
${photos}
</div>`
:""
}

<div class="actions">

<button
class="btn soft"
onclick="editEntry('${String(e.id).replace(/'/g,"\\'")}')">
✏️ 编辑
</button>

<button
class="btn danger"
onclick="removeEntry('${String(e.id).replace(/'/g,"\\'")}')">
🗑️ 删除
</button>

</div>

</article>

`;

}).join("");

}


/* ================================
   统计
================================ */

function updateStats(){

$("count").textContent =
entries.length;


$("studyCount").textContent =
entries.filter(
e =>
String(e.type || "")
.includes("A等")
).length;


$("taCount").textContent =
entries.filter(
e =>
String(e.type || "")
.includes("助教")
).length;


$("streak").textContent =
calcStreak();


const ym =
today().slice(0,7);


const days =
new Set(

entries

.filter(
e =>
String(e.date || "")
.slice(0,7) === ym
)

.map(e => e.date)

).size;


const goal = 20;

const p =
Math.min(
100,
days / goal * 100
);


$("goalText").textContent =
`${days} / ${goal} 天`;


$("goalBar").style.width =
p + "%";

}


/* ================================
   连续记录天数
================================ */

function calcStreak(){

const ds =
new Set(
entries
.map(e => e.date)
.filter(Boolean)
);


let d = new Date();

d.setHours(
0,0,0,0
);


let n = 0;


while(
ds.has(
d.toISOString().slice(0,10)
)
){

n++;

d.setDate(
d.getDate() - 1
);

}


return n;

}


/* ================================
   防止 HTML 注入
================================ */

function esc(s){

return String(s ?? "")
.replace(
/[&<>"']/g,
m => ({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m])
);

}

   云端登录状态监听
================================ */

sb.auth.onAuthStateChange(
() =>
setTimeout(
refreshCloudSession,
0
)
);


/* ================================
   启动
================================ */

updateAccountUI();

updateStats();

render();

refreshCloudSession();

</script>
