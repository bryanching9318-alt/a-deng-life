<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5ce7">
<title>A等生活 · 助教日记</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans SC",sans-serif;
  color:#20243a;
  background:
    linear-gradient(160deg,#eef2ff 0%,#f8f7ff 45%,#fdfcff 100%);
  min-height:100vh;
}

.app{
  max-width:820px;
  margin:auto;
  padding:18px 15px 70px;
}

/* ===== 顶部 ===== */

.hero{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(135deg,#5b5ce2,#8b5cf6 55%,#c084fc);
  color:white;
  border-radius:30px;
  padding:28px 23px 24px;
  margin-bottom:14px;
  box-shadow:0 18px 45px #5b5ce233;
}

.hero:before,
.hero:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:#ffffff1c;
  pointer-events:none;
}

.hero:before{
  width:180px;
  height:180px;
  right:-70px;
  top:-80px;
}

.hero:after{
  width:110px;
  height:110px;
  left:-55px;
  bottom:-60px;
}

h1{
  position:relative;
  margin:0 0 6px;
  font-size:30px;
  letter-spacing:-.5px;
}

.sub{
  position:relative;
  color:#f3efff;
  font-size:14px;
}

/* ===== 励志语录 ===== */

.quote{
  position:relative;
  margin-top:20px;
  font-size:18px;
  font-weight:850;
  line-height:1.6;
  background:#ffffff18;
  border:1px solid #ffffff2b;
  border-radius:18px;
  padding:14px 15px;
  backdrop-filter:blur(8px);
}

.quote-btn{
  position:relative;
  margin-top:10px;
  border:1px solid #ffffff3d;
  background:#ffffff20;
  color:white;
  border-radius:13px;
  padding:9px 13px;
  font-weight:800;
  cursor:pointer;
}

/* ===== 账户 ===== */

.account{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:13px 0;
  padding:14px 16px;
  background:#fffffff2;
  border:1px solid #e9e7ff;
  border-radius:20px;
  box-shadow:0 8px 28px #5b5ce214;
}

.account-status{
  font-size:13px;
  font-weight:800;
  word-break:break-all;
}

.account-status span{
  color:#667085;
}

/* ===== 数据 ===== */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.stat{
  background:#fff;
  border:1px solid #ecebfa;
  border-radius:19px;
  padding:15px 6px;
  text-align:center;
  box-shadow:0 8px 25px #5b5ce20b;
}

.num{
  font-size:23px;
  font-weight:950;
  color:#5146c9;
}

.stat small{
  font-size:11px;
  color:#73798f;
}

/* ===== 目标 ===== */

.goal{
  background:#fff;
  border:1px solid #ecebfa;
  border-radius:20px;
  padding:15px;
  margin:13px 0;
  box-shadow:0 8px 25px #5b5ce20b;
}

.goalline{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:850;
}

.bar{
  height:10px;
  background:#ecebfa;
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#5b5ce2,#a855f7);
  border-radius:99px;
  width:0;
  transition:width .5s ease;
}

/* ===== 导航 ===== */

.tabs{
  display:flex;
  gap:8px;
  margin:14px 0;
}

.tab{
  flex:1;
  border:1px solid #e8e7f5;
  background:#fff;
  color:#535a70;
  padding:12px 14px;
  border-radius:16px;
  font-weight:850;
  box-shadow:0 5px 18px #5b5ce208;
  cursor:pointer;
}

.tab.active{
  border-color:transparent;
  background:linear-gradient(135deg,#5b5ce2,#8b5cf6);
  color:#fff;
  box-shadow:0 8px 22px #6d5ce233;
}

/* ===== 卡片 ===== */

.card{
  background:#fff;
  border:1px solid #ecebfa;
  border-radius:23px;
  padding:20px;
  margin:13px 0;
  box-shadow:0 10px 30px #5b5ce20b;
}

h2{
  margin:0 0 10px;
  font-size:21px;
}

/* ===== 表单 ===== */

label{
  display:block;
  font-weight:800;
  margin:13px 0 7px;
  font-size:14px;
  color:#3c4055;
}

input,
textarea,
select{
  width:100%;
  padding:13px 14px;
  border:1px solid #e2e3ef;
  border-radius:14px;
  font:inherit;
  background:#fafaff;
  color:#25283b;
  outline:none;
  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#8177e8;
  box-shadow:0 0 0 4px #8177e81a;
  background:#fff;
}

textarea{
  min-height:115px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

/* ===== 按钮 ===== */

.btn{
  border:0;
  border-radius:14px;
  padding:11px 15px;
  font-weight:850;
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}

.btn:active{
  transform:scale(.98);
}

.primary{
  background:linear-gradient(135deg,#5b5ce2,#8b5cf6);
  color:#fff;
  box-shadow:0 7px 18px #6d5ce22b;
}

.soft{
  background:#efefff;
  color:#5146c9;
}

.danger{
  background:#fff0f1;
  color:#b42335;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:16px;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* ===== 日记 ===== */

.entry{
  border:1px solid #e7e5f5;
  border-radius:19px;
  padding:16px;
  margin:11px 0;
  background:linear-gradient(180deg,#fff,#fcfbff);
  box-shadow:0 7px 22px #5b5ce20a;
}

.entry h3{
  margin:7px 0;
  font-size:18px;
}

.entry p{
  line-height:1.65;
  color:#464b61;
}

.meta{
  font-size:12px;
  color:#7b8195;
}

.tag{
  display:inline-block;
  background:#f0efff;
  color:#5146c9;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  margin:2px;
}

/* ===== 搜索 ===== */

.empty{
  text-align:center;
  color:#8a90a3;
  padding:30px 10px;
}

.filters{
  display:grid;
  grid-template-columns:1fr 155px;
  gap:9px;
  margin:10px 0;
}

/* ===== 图片 ===== */

.photo-preview,
.photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.photo-preview img,
.photo-grid img{
  width:100%;
  height:115px;
  object-fit:cover;
  border-radius:15px;
  border:1px solid #e4e2f1;
  box-shadow:0 5px 15px #0000000b;
  cursor:pointer;
  transition:.2s;
}

.photo-preview img:hover,
.photo-grid img:hover{
  transform:scale(1.02);
}

/* ===== 小提示 ===== */

.note{
  font-size:12px;
  color:#858b9e;
  margin-top:9px;
  line-height:1.5;
}

/* ===== 登录弹窗 ===== */

.modal{
  position:fixed;
  inset:0;
  background:#17152f99;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:99;
  backdrop-filter:blur(6px);
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(430px,100%);
  background:#fff;
  border-radius:25px;
  padding:23px;
  box-shadow:0 25px 70px #0005;
}

.modal-card input{
  margin:7px 0 12px;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-actions button{
  flex:1;
}

.auth-note{
  font-size:12px;
  color:#777d90;
  line-height:1.55;
}

.switch{
  border:0;
  background:none;
  color:#5b5ce2;
  font-weight:850;
  cursor:pointer;
}

.loading{
  text-align:center;
  padding:20px;
  color:#687087;
}

/* ===== 手机 ===== */

@media(max-width:520px){

  .row{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .filters{
    grid-template-columns:1fr;
  }

  .app{
    padding:10px 11px 55px;
  }

  .hero{
    border-radius:25px;
    padding:24px 18px;
  }

  .hero h1{
    font-size:26px;
  }

  .card{
    padding:17px;
    border-radius:20px;
  }

  .photo-preview,
  .photo-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .photo-preview img,
  .photo-grid img{
    height:125px;
  }

  .tabs{
    position:sticky;
    top:5px;
    z-index:10;
    padding:4px;
    background:#f8f7ffdd;
    backdrop-filter:blur(10px);
  }
}
</style>
</head>

<body>

<div class="app">

<!-- 顶部 -->
<section class="hero">

  <h1>🌟 A等生活 · 助教日记</h1>

  <div class="sub">
    记录每一天的努力、成长与助教时光
  </div>

  <div class="quote" id="quote"></div>

  <button class="quote-btn" onclick="randomQuote()">
    🔄 再来一句
  </button>

</section>


<!-- 账户 -->
<div class="account">

  <div class="account-status" id="accountStatus">
    ☁️ 未登录
  </div>

  <button
    class="btn soft"
    id="accountBtn"
    onclick="openAuth()">
    登录 / 注册
  </button>

</div>


<!-- 数据统计 -->
<div class="stats">

  <div class="stat">
    <div class="num" id="count">0</div>
    <small>总记录</small>
  </div>

  <div class="stat">
    <div class="num" id="studyCount">0</div>
    <small>A等生活</small>
  </div>

  <div class="stat">
    <div class="num" id="taCount">0</div>
    <small>助教记录</small>
  </div>

  <div class="stat">
    <div class="num" id="streak">0</div>
    <small>连续天数</small>
  </div>

</div>


<!-- 目标 -->
<div class="goal">

  <div class="goalline">
    <span>🎯 本月目标</span>
    <span id="goalText">0 / 20 天</span>
  </div>

  <div class="bar">
    <i id="goalBar"></i>
  </div>

</div>


<!-- 页面切换 -->
<div class="tabs">

  <button
    class="tab active"
    onclick="showTab('new',this)">
    ✍️ 写记录
  </button>

  <button
    class="tab"
    onclick="showTab('list',this)">
    📖 我的记录
  </button>

</div>


<!-- 写记录 -->
<section id="new" class="card">

  <h2 id="formTitle">
    写下今天
  </h2>

  <div class="row">

    <div>
      <label>日期</label>
      <input id="date" type="date">
    </div>

    <div>
      <label>类型</label>

      <select id="type">
        <option>A等生活</option>
        <option>助教生活</option>
        <option>A等生活 + 助教</option>
      </select>

    </div>

  </div>


  <label>标题</label>

  <input
    id="title"
    placeholder="例如：今天又进步了一点">


  <label>今天做了什么？</label>

  <textarea
    id="content"
    placeholder="学习、目标、助教工作、和学生的互动……"></textarea>


  <div class="row">

    <div>

      <label>今日心情</label>

      <select id="mood">

        <option>😊 很棒</option>
        <option>🙂 不错</option>
        <option>😐 普通</option>
        <option>😮‍💨 有点累</option>
        <option>💪 继续坚持</option>

      </select>

    </div>


    <div>

      <label>今日评分</label>

      <select id="score">

        <option>5 ⭐</option>
        <option>4 ⭐</option>
        <option>3 ⭐</option>
        <option>2 ⭐</option>
        <option>1 ⭐</option>

      </select>

    </div>

  </div>


  <label>
    今天的收获 / 给自己的话
  </label>

  <textarea
    id="lesson"
    placeholder="今天学到了什么？想对未来的自己说什么？"></textarea>


  <label>
    📸 今天的照片
  </label>

  <input
    id="photo"
    type="file"
    accept="image/*"
    multiple
    onchange="previewPhotos(event)">

  <div
    class="photo-preview"
    id="photoPreview">
  </div>

  <div class="note">
    照片会直接上传到云端相册，不保存为本机日记数据。
  </div>


  <div class="actions">

    <button
      class="btn primary"
      id="saveBtn"
      onclick="saveEntry()">
      ☁️ 保存到云端
    </button>

    <button
      class="btn soft"
      onclick="clearForm()">
      清空
    </button>

    <button
      class="btn danger"
      id="cancelBtn"
      onclick="cancelEdit()"
      style="display:none">
      取消编辑
    </button>

  </div>

</section>


<!-- 我的记录 -->
<section
  id="list"
  class="card"
  style="display:none">

  <h2>
    📖 我的记录
  </h2>

  <div class="filters">

    <input
      id="search"
      placeholder="搜索标题、内容、收获……"
      oninput="render()">

    <select
      id="filter"
      onchange="render()">

      <option value="全部">
        全部类型
      </option>

      <option>
        A等生活
      </option>

      <option>
        助教生活
      </option>

      <option>
        A等生活 + 助教
      </option>

    </select>

  </div>

  <div id="entries">

    <div class="empty">
      请先登录云端账户。
    </div>

  </div>

</section>

</div>


<!-- 登录弹窗 -->
<div class="modal" id="authModal">

  <div class="modal-card">

    <h2 id="authTitle">
      👤 登录账户
    </h2>

    <p
      class="auth-note"
      id="authMsg">
      登录后，日记和照片会保存到你的云端账户，
      换设备登录也能继续查看。
    </p>


    <input
      id="authUser"
      type="email"
      placeholder="邮箱">


    <input
      id="authPass"
      type="password"
      placeholder="密码">


    <div class="modal-actions">

      <button
        class="btn soft"
        onclick="closeAuth()">
        取消
      </button>

      <button
        class="btn primary"
        onclick="submitAuth()"
        id="authSubmit">
        登录
      </button>

    </div>


    <p
      style="text-align:center;margin:14px 0 0">

      <button
        class="switch"
        onclick="toggleAuthMode()"
        id="authSwitch">
        没有账户？点击注册
      </button>

    </p>

  </div>

</div>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://covnjgtdwpsothkcasls.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MsamuvgocYfdrm_BbpXiAw_Bw6F48Z1";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const CLOUD_TABLE =
"diary_entries";

const CLOUD_BUCKET =
"diary-photos";


/* =========================
   状态
========================= */

let cloudUser = null;

let entries = [];

let editingId = null;

let authMode = "login";


/* =========================
   励志语录
========================= */

const quotes = [

"今天的努力，会成为明天的底气。",

"慢一点没关系，重要的是一直向前。",

"把小事做好，就是A等生活。",

"认真生活，认真学习，认真做好每一次助教。",

"你今天的坚持，正在悄悄改变未来。",

"真正的成长，是每天比昨天更认真一点。",

"不要害怕走得慢，只要你没有停下来。",

"优秀不是天生的，是一次次坚持换来的。",

"今天多努力一点，未来就多一份选择。",

"你认真走过的每一步，都算数。",

"累的时候可以休息，但不要轻易放弃。",

"把今天过好，就是对未来最好的负责。",

"没有白费的努力，只有还没到时候的收获。",

"相信自己，你比想象中更有潜力。",

"先完成，再完美；先行动，再进步。",

"真正厉害的人，是把平凡的日子过得认真。",

"每一次坚持，都是在给未来的自己加分。",

"困难不会一直存在，坚持会让你越来越强。",

"别羡慕别人的起点，走好自己的路。",

"今天的你，正在成为明天更好的你。",

"学习不是为了证明给别人看，而是为了拥有更多可能。",

"愿你眼里有光，心里有方向，脚下有力量。",

"做一个自律的人，也做一个温柔的人。",

"把目标放在心里，把行动放在每天。",

"当你觉得坚持很难的时候，说明你正在成长。"

];


const $ =
id => document.getElementById(id);


/* =========================
   随机语录
========================= */

function randomIndex(max){

  if(
    window.crypto &&
    crypto.getRandomValues
  ){

    const a =
      new Uint32Array(1);

    crypto.getRandomValues(a);

    return a[0] % max;
  }

  return Math.floor(
    Math.random() * max
  );
}


function randomQuote(){

  $("quote").textContent =
    quotes[
      randomIndex(quotes.length)
    ];

}


/* =========================
   日期
========================= */

function today(){

  const d = new Date();

  d.setMinutes(
    d.getMinutes()
    - d.getTimezoneOffset()
  );

  return d
    .toISOString()
    .slice(0,10);

}


$("date").value = today();


/* 打开网页时随机语录 */

randomQuote();


/* =========================
   登录弹窗
========================= */

function openAuth(){

  $("authModal")
    .classList
    .add("show");

  $("authUser").value =
    cloudUser?.email || "";

  $("authPass").value = "";

  $("authMsg").textContent =
    "登录后，日记和照片会保存到你的云端账户，换设备登录也能继续查看。";
}


function closeAuth(){

  $("authModal")
    .classList
    .remove("show");

}


function toggleAuthMode(){

  authMode =
    authMode === "login"
    ? "register"
    : "login";


  $("authTitle").textContent =
    authMode === "login"
    ? "👤 登录账户"
    : "🆕 注册账户";


  $("authSubmit").textContent =
    authMode === "login"
    ? "登录"
    : "注册";


  $("authSwitch").textContent =
    authMode === "login"
    ? "没有账户？点击注册"
    : "已有账户？点击登录";


  $("authMsg").textContent =
    authMode === "login"
    ? "登录后，日记和照片会保存到你的云端账户，换设备登录也能继续查看。"
    : "注册一个云端账户，你的日记和照片将与账户绑定。";

}


/* =========================
   登录 / 注册
========================= */

async function submitAuth(){

  const email =
    $("authUser").value.trim();

  const password =
    $("authPass").value;


  if(!email || !password){

    $("authMsg").textContent =
      "请输入邮箱和密码。";

    return;

  }


  if(password.length < 6){

    $("authMsg").textContent =
      "密码至少需要 6 位。";

    return;

  }


  $("authSubmit").disabled = true;


  try{

    let result;


    if(authMode === "register"){

      result =
        await sb.auth.signUp({
          email,
          password
        });

    }else{

      result =
        await sb.auth.signInWithPassword({
          email,
          password
        });

    }


    if(result.error)
      throw result.error;


    if(
      authMode === "register" &&
      !result.data.session
    ){

      $("authMsg").textContent =
        "注册成功！如果系统要求邮箱验证，请先完成邮箱验证，再回来登录。";

      return;

    }


    await refreshCloudSession();

    closeAuth();

    alert(
      authMode === "login"
      ? "登录成功！"
      : "注册成功！"
    );


  }catch(e){

    $("authMsg").textContent =
      e.message ||
      "操作失败，请重试。";

  }finally{

    $("authSubmit").disabled = false;

  }

}


/* =========================
   退出登录
========================= */

async function logout(){

  await sb.auth.signOut();

  cloudUser = null;

  entries = [];

  editingId = null;

  updateAccountUI();

  render();

  updateStats();

  clearForm();

}


/* =========================
   账户 UI
========================= */

function updateAccountUI(){

  if(cloudUser){

    $("accountStatus").innerHTML =
      "☁️ 已登录：<span>"
      + esc(cloudUser.email)
      + "</span>";

    $("accountBtn").textContent =
      "退出账户";

    $("accountBtn").onclick =
      logout;

  }else{

    $("accountStatus").textContent =
      "☁️ 未登录";

    $("accountBtn").textContent =
      "登录 / 注册";

    $("accountBtn").onclick =
      openAuth;

  }

}


/* =========================
   云端 Session
========================= */

async function refreshCloudSession(){

  const {data} =
    await sb.auth.getSession();

  cloudUser =
    data.session?.user || null;

  updateAccountUI();


  if(cloudUser){

    await loadCloudEntries();

  }else{

    entries = [];

    render();

    updateStats();

  }

}


/* =========================
   上传照片
========================= */

async function uploadPhoto(
  file,
  userId
){

  const ext =
    (
      file.name
      ?.split(".")
      .pop()
      || "jpg"
    )
    .replace(
      /[^a-z0-9]/gi,
      ""
    )
    .toLowerCase()
    || "jpg";


  const path =
    userId +
    "/" +
    crypto.randomUUID() +
    "." +
    ext;


  const {error} =
    await sb
      .storage
      .from(CLOUD_BUCKET)
      .upload(
        path,
        file,
        {
          contentType:
            file.type ||
            "image/jpeg",

          upsert:false
        }
      );


  if(error)
    throw error;


  return path;

}


/* =========================
   获取照片 URL
========================= */

async function signedPhoto(path){

  const {data,error} =
    await sb
      .storage
      .from(CLOUD_BUCKET)
      .createSignedUrl(
        path,
        3600
      );


  if(error)
    throw error;


  return data.signedUrl;

}


/* =========================
   读取云端日记
========================= */

async function loadCloudEntries(){

  if(!cloudUser)
    return;


  $("entries").innerHTML =
    '<div class="loading">☁️ 正在读取你的云端记录…</div>';


  const {data,error} =
    await sb
      .from(CLOUD_TABLE)
      .select("*")
      .eq(
        "user_id",
        cloudUser.id
      )
      .order(
        "date",
        {ascending:false}
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    $("entries").innerHTML =
      '<div class="empty">读取云端记录失败：'
      + esc(error.message)
      + '</div>';

    return;

  }


  entries = [];


  for(
    const x of (data || [])
  ){

    const photos = [];


    for(
      const path of (x.photos || [])
    ){

      try{

        photos.push({
          path,
          url:
            await signedPhoto(path)
        });

      }catch(e){}

    }


    entries.push({

      id:x.id,

      date:x.date,

      type:x.type,

      title:x.title,

      content:x.content,

      mood:x.mood,

      score:x.score,

      lesson:x.lesson,

      photos

    });

  }


  render();

  updateStats();

}


/* =========================
   保存记录
========================= */

async function saveEntry(){

  if(!cloudUser){

    openAuth();

    return;

  }


  const files =
    [
      ...(
        $("photo").files || []
      )
    ];


  const old =
    editingId
    ? entries.find(
        x =>
          String(x.id)
          ===
          String(editingId)
      )
    : null;


  const e = {

    date:
      $("date").value,

    type:
      $("type").value,

    title:
      $("title").value.trim()
      ||
      "今天的记录",

    content:
      $("content").value.trim(),

    mood:
      $("mood").value,

    score:
      $("score").value,

    lesson:
      $("lesson").value.trim()

  };


  if(
    !e.content &&
    !e.lesson &&
    !files.length &&
    (old?.photos || []).length === 0
  ){

    alert(
      "请至少写一点今天的记录或添加照片。"
    );

    return;

  }


  const btn =
    $("saveBtn");

  btn.disabled = true;

  btn.textContent =
    "☁️ 正在保存…";


  const wasEditing =
    !!editingId;


  try{

    const photoPaths =
      (old?.photos || [])
      .map(x => x.path)
      .filter(Boolean);


    for(
      const f of files
    ){

      photoPaths.push(
        await uploadPhoto(
          f,
          cloudUser.id
        )
      );

    }


    const payload = {

      ...e,

      user_id:
        cloudUser.id,

      photos:
        photoPaths

    };


    let error;


    if(editingId){

      ({
        error
      } =
        await sb
          .from(CLOUD_TABLE)
          .update(payload)
          .eq(
            "id",
            editingId
          )
          .eq(
            "user_id",
            cloudUser.id
          ));

    }else{

      ({
        error
      } =
        await sb
          .from(CLOUD_TABLE)
          .insert(
            payload
          ));

    }


    if(error)
      throw error;


    await loadCloudEntries();

    cancelEdit();

    clearForm();


    alert(
      wasEditing
      ? "已更新并同步到云端！"
      : "已保存并同步到云端！"
    );


    showTab(
      "list",
      document.querySelectorAll(".tab")[1]
    );


  }catch(e){

    alert(
      "保存失败："
      +
      (e.message || e)
    );


  }finally{

    btn.disabled = false;

    btn.textContent =
      wasEditing
      ? "💾 更新记录"
      : "☁️ 保存到云端";

  }

}


/* =========================
   照片预览
========================= */

function previewPhotos(ev){

  const files =
    ev.target.files || [];

  const box =
    $("photoPreview");

  box.innerHTML = "";


  [
    ...files
  ].forEach(f => {

    const r =
      new FileReader();


    r.onload = () => {

      const img =
        document.createElement("img");

      img.src =
        r.result;

      img.alt =
        "预览照片";

      box.appendChild(img);

    };


    r.readAsDataURL(f);

  });

}


/* =========================
   清空表单
========================= */

function clearForm(){

  editingId = null;

  $("formTitle").textContent =
    "写下今天";

  $("saveBtn").textContent =
    "☁️ 保存到云端";

  $("cancelBtn").style.display =
    "none";

  $("title").value =
    "";

  $("content").value =
    "";

  $("lesson").value =
    "";

  $("mood").value =
    "😊 很棒";

  $("score").value =
    "5 ⭐";

  $("date").value =
    today();

  $("type").value =
    "A等生活";

  $("photo").value =
    "";

  $("photoPreview").innerHTML =
    "";

}


/* =========================
   编辑记录
========================= */

function editEntry(id){

  const e =
    entries.find(
      x =>
        String(x.id)
        ===
        String(id)
    );


  if(!e)
    return;


  editingId =
    e.id;


  $("date").value =
    e.date || today();

  $("type").value =
    e.type || "A等生活";

  $("title").value =
    e.title || "";

  $("content").value =
    e.content || "";

  $("mood").value =
    e.mood || "😊 很棒";

  $("score").value =
    e.score || "5 ⭐";

  $("lesson").value =
    e.lesson || "";


  $("photo").value =
    "";


  $("photoPreview").innerHTML =
    (e.photos || [])
      .map(
        x =>
          x.url
          ? `<img src="${x.url}" alt="已有照片">`
          : ""
      )
      .join("");


  $("formTitle").textContent =
    "✏️ 编辑记录";

  $("saveBtn").textContent =
    "💾 更新记录";

  $("cancelBtn").style.display =
    "inline-block";


  showTab(
    "new",
    document.querySelectorAll(".tab")[0]
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   取消编辑
========================= */

function cancelEdit(){

  editingId = null;

  $("formTitle").textContent =
    "写下今天";

  $("saveBtn").textContent =
    "☁️ 保存到云端";

  $("cancelBtn").style.display =
    "none";

}


/* =========================
   删除记录
========================= */

async function removeEntry(id){

  if(
    !cloudUser ||
    !confirm(
      "确定删除这条记录吗？删除后云端记录也会删除。"
    )
  )
    return;


  const e =
    entries.find(
      x =>
        String(x.id)
        ===
        String(id)
    );


  try{

    const paths =
      (e?.photos || [])
      .map(x => x.path)
      .filter(Boolean);


    if(paths.length){

      await sb
        .storage
        .from(CLOUD_BUCKET)
        .remove(paths);

    }


    const {error} =
      await sb
        .from(CLOUD_TABLE)
        .delete()
        .eq("id",id)
        .eq(
          "user_id",
          cloudUser.id
        );


    if(error)
      throw error;


    await loadCloudEntries();


  }catch(err){

    alert(
      "删除失败："
      +
      err.message
    );

  }

}


/* =========================
   页面切换
========================= */

function showTab(id,btn){

  [
    "new",
    "list"
  ].forEach(
    x =>
      $(x).style.display =
        x === id
        ? "block"
        : "none"
  );


  document
    .querySelectorAll(".tab")
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );


  if(btn)
    btn.classList.add("active");


  if(id === "list")
    render();

}


/* =========================
   渲染记录
========================= */

function render(){

  const box =
    $("entries");


  if(!cloudUser){

    box.innerHTML =
      '<div class="empty">请先登录云端账户，再查看你的记录。</div>';

    return;

  }


  const q =
    (
      $("search")?.value
      || ""
    )
    .toLowerCase();


  const f =
    $("filter")?.value
    || "全部";


  const arr =
    entries.filter(e => {

      const matchType =
        f === "全部"
        ||
        e.type === f;


      const text =
        [
          e.title,
          e.content,
          e.lesson,
          e.type,
          e.mood
        ]
        .join(" ")
        .toLowerCase();


      return (
        matchType &&
        text.includes(q)
      );

    });


  if(!arr.length){

    box.innerHTML =
      '<div class="empty">还没有符合条件的记录。写下你的第一篇吧 ✨</div>';

    return;

  }


  box.innerHTML =
    arr.map(e => {

      const photos =
        (e.photos || [])
          .filter(x => x.url)
          .map(
            x =>
              `<img
                src="${x.url}"
                alt="记录照片"
                loading="lazy"
                onclick="window.open(this.src,'_blank')">`
          )
          .join("");


      return `

      <article class="entry">

        <div class="meta">
          📅 ${esc(e.date)}
          · ${esc(e.type)}
          · ${esc(e.mood)}
        </div>

        <h3>
          ${esc(e.title)}
        </h3>

        <span class="tag">
          ${esc(e.score)}
        </span>

        ${
          e.content
          ?
          `<p>
            ${esc(e.content)
              .replace(/\n/g,"<br>")}
          </p>`
          :
          ""
        }

        ${
          e.lesson
          ?
          `<p>
            <b>💡 收获：</b>
            ${esc(e.lesson)
              .replace(/\n/g,"<br>")}
          </p>`
          :
          ""
        }

        ${
          photos
          ?
          `<div class="photo-grid">
            ${photos}
          </div>`
          :
          ""
        }

        <div class="actions">

          <button
            class="btn soft"
            onclick="editEntry('${String(e.id).replace(/'/g,"\\'")}')">
            ✏️ 编辑
          </button>

          <button
            class="btn danger"
            onclick="removeEntry('${String(e.id).replace(/'/g,"\\'")}')">
            🗑️ 删除
          </button>

        </div>

      </article>

      `;

    }).join("");

}


/* =========================
   统计
========================= */

function updateStats(){

  $("count").textContent =
    entries.length;


  $("studyCount").textContent =
    entries.filter(
      e =>
        String(e.type || "")
        .includes("A等")
    ).length;


  $("taCount").textContent =
    entries.filter(
      e =>
        String(e.type || "")
        .includes("助教")
    ).length;


  $("streak").textContent =
    calcStreak();


  const ym =
    today().slice(0,7);


  const days =
    new Set(
      entries
        .filter(
          e =>
            String(e.date || "")
            .slice(0,7)
            === ym
        )
        .map(
          e => e.date
        )
    ).size;


  const goal = 20;


  const p =
    Math.min(
      100,
      days / goal * 100
    );


  $("goalText").textContent =
    `${days} / ${goal} 天`;


  $("goalBar").style.width =
    p + "%";

}


/* =========================
   连续天数
========================= */

function calcStreak(){

  const ds =
    new Set(
      entries
        .map(e => e.date)
        .filter(Boolean)
    );


  let d =
    new Date();


  d.setHours(
    0,0,0,0
  );


  let n = 0;


  while(
    ds.has(
      d.toISOString()
       .slice(0,10)
    )
  ){

    n++;

    d.setDate(
      d.getDate() - 1
    );

  }


  return n;

}


/* =========================
   防止 HTML 注入
========================= */

function esc(s){

  return String(
    s ?? ""
  ).replace(
    /[&<>"']/g,
    m =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
  );

}


/* =========================
   初始化
========================= */

sb.auth.onAuthStateChange(
  () =>
    setTimeout(
      refreshCloudSession,
      0
    )
);


updateAccountUI();

updateStats();

render();

refreshCloudSession();

</script>
