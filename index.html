<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>A等生活 · 助教日记</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6fb;color:#182033}
.app{max-width:760px;margin:auto;padding:18px 14px 90px}.hero{background:linear-gradient(135deg,#ffffff,#edf2ff);border-radius:26px;padding:24px 20px;margin-bottom:14px;box-shadow:0 10px 30px #0000000d}
h1{margin:0 0 6px;font-size:28px}.sub{color:#697386;font-size:14px}.quote{margin-top:18px;font-size:18px;font-weight:700}
.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tab{border:0;background:#fff;padding:11px 15px;border-radius:14px;font-weight:700;white-space:nowrap}.tab.active{background:#1d4ed8;color:#fff}
.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 6px 22px #0000000a}
label{display:block;font-weight:700;margin:13px 0 7px;font-size:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #dfe4ee;border-radius:12px;font:inherit;background:#fbfcfe}textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:#1d4ed8;color:white}.soft{background:#eef2ff;color:#1e40af}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.entry{border:1px solid #e7eaf0;border-radius:16px;padding:14px;margin:10px 0}.entry h3{margin:0 0 5px}.meta{font-size:12px;color:#778195}.tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 8px;font-size:12px;margin:3px}.empty{text-align:center;color:#8992a4;padding:25px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f8fc;border-radius:15px;padding:13px;text-align:center}.num{font-size:23px;font-weight:900}
@media(max-width:520px){.row{grid-template-columns:1fr}.app{padding-top:10px}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>🌟 A等生活 · 助教日记</h1>
    <div class="sub">记录每一天的努力、成长与助教时光</div>
    <div class="quote" id="quote">今天的努力，会成为明天的底气。</div>
  </section>

  <div class="stats">
    <div class="stat"><div class="num" id="count">0</div><small>总记录</small></div>
    <div class="stat"><div class="num" id="studyCount">0</div><small>A等生活</small></div>
    <div class="stat"><div class="num" id="taCount">0</div><small>助教记录</small></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('new',this)">✍️ 写记录</button>
    <button class="tab" onclick="showTab('list',this)">📖 我的记录</button>
    <button class="tab" onclick="showTab('backup',this)">💾 保存/下载</button>
  </div>

  <section id="new" class="card">
    <h2>写下今天</h2>
    <div class="row">
      <div><label>日期</label><input id="date" type="date"></div>
      <div><label>类型</label><select id="type"><option value="A等生活">⭐ A等生活</option><option value="助教生活">👨‍🏫 助教生活</option><option value="A等生活 + 助教">🌟 A等生活 + 助教</option></select></div>
    </div>
    <label>标题</label><input id="title" placeholder="例如：今天又进步了一点">
    <label>今天做了什么？</label><textarea id="content" placeholder="学习、目标、助教工作、和学生的互动……"></textarea>
    <div class="row">
      <div><label>今日心情</label><select id="mood"><option>😊 很棒</option><option>🙂 不错</option><option>😐 普通</option><option>😮‍💨 有点累</option><option>💪 继续坚持</option></select></div>
      <div><label>今日评分</label><select id="score"><option>5 ⭐</option><option>4 ⭐</option><option>3 ⭐</option><option>2 ⭐</option><option>1 ⭐</option></select></div>
    </div>
    <label>今天的收获 / 给自己的话</label><textarea id="lesson" placeholder="今天学到了什么？想对未来的自己说什么？"></textarea>
    <div class="actions"><button class="btn primary" onclick="saveEntry()">💾 保存今天的记录</button><button class="btn soft" onclick="clearForm()">清空</button></div>
  </section>

  <section id="list" class="card" style="display:none">
    <h2>📖 我的记录</h2>
    <input id="search" placeholder="搜索标题、内容……" oninput="render()">
    <div id="entries"></div>
  </section>

  <section id="backup" class="card" style="display:none">
    <h2>💾 保存与下载</h2>
    <p>记录保存在这台设备的浏览器中。建议定期下载备份，换手机时再导入。</p>
    <div class="actions">
      <button class="btn primary" onclick="downloadJSON()">⬇️ 下载完整备份</button>
      <button class="btn soft" onclick="downloadTXT()">📄 下载文字版</button>
      <label class="btn soft" style="display:inline-block">📤 导入备份<input id="importFile" type="file" accept=".json" onchange="importJSON(event)" style="display:none"></label>
      <button class="btn danger" onclick="deleteAll()">删除全部记录</button>
    </div>
  </section>
</div>

<script>
const KEY='a等生活助教日记_v1';
let entries=JSON.parse(localStorage.getItem(KEY)||'[]');
const quotes=['今天的努力，会成为明天的底气。','慢一点没关系，重要的是一直向前。','把小事做好，就是A等生活。','认真生活，认真学习，认真做好每一次助教。','你今天的坚持，正在悄悄改变未来。'];
document.getElementById('date').value=new Date().toISOString().slice(0,10);
document.getElementById('quote').textContent=quotes[new Date().getDate()%quotes.length];

function save(){localStorage.setItem(KEY,JSON.stringify(entries));updateStats();render()}
function saveEntry(){
 const e={id:Date.now(),date:date.value,type:type.value,title:title.value.trim()||'今天的记录',content:content.value.trim(),mood:mood.value,score:score.value,lesson:lesson.value.trim()};
 if(!e.content&&!e.lesson){alert('请至少写一点今天的记录。');return}
 entries.unshift(e);save();clearForm();alert('已保存！你的记录就在这台设备里。');showTab('list',document.querySelectorAll('.tab')[1]);
}
function clearForm(){title.value='';content.value='';lesson.value='';mood.value='😊 很棒';score.value='5 ⭐'}
function showTab(id,btn){['new','list','backup'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='list')render()}
function render(){
 const q=(search?.value||'').toLowerCase(); const box=document.getElementById('entries');
 const arr=entries.filter(e=>(e.title+' '+e.content+' '+e.lesson+' '+e.type).toLowerCase().includes(q));
 if(!arr.length){box.innerHTML='<div class="empty">还没有记录。写下你的第一篇吧 ✨</div>';return}
 box.innerHTML=arr.map(e=>`<article class="entry"><div class="meta">${e.date} · ${e.type} · ${e.mood}</div><h3>${esc(e.title)}</h3><span class="tag">${esc(e.score)}</span><p>${esc(e.content).replace(/\n/g,'<br>')}</p>${e.lesson?'<b>💡 收获：</b>'+esc(e.lesson).replace(/\n/g,'<br>'):''}<div class="actions"><button class="btn danger" onclick="removeEntry(${e.id})">删除</button></div></article>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function removeEntry(id){if(confirm('确定删除这条记录吗？')){entries=entries.filter(e=>e.id!==id);save()}}
function updateStats(){count.textContent=entries.length;studyCount.textContent=entries.filter(e=>e.type.includes('A等')).length;taCount.textContent=entries.filter(e=>e.type.includes('助教')).length}
function downloadJSON(){download(new Blob([JSON.stringify(entries,null,2)],{type:'application/json'}),'A等生活-助教日记-备份.json')}
function downloadTXT(){let t='A等生活 · 助教日记\\n\\n'+entries.map(e=>`【${e.date}】${e.title}\\n类型：${e.type}\\n心情：${e.mood}｜评分：${e.score}\\n${e.content}\\n收获：${e.lesson}\\n--------------------`).join('\\n');download(new Blob([t],{type:'text/plain;charset=utf-8'}),'A等生活-助教日记.txt')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;entries=[...x,...entries].filter((e,i,a)=>a.findIndex(z=>z.id===e.id)===i);save();alert('导入成功！')}catch{alert('备份文件格式不正确。')}};r.readAsText(f)}
function deleteAll(){if(confirm('确定删除全部记录？此操作无法撤销，请先下载备份。')){entries=[];save();render()}}
updateStats();render();
</script>
</body>
</html>
