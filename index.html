<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A等生活 · 助教日记</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff);
  color:#243447;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 8px 30px #0001;
}

h1{
  margin:0 0 5px;
  font-size:27px;
}

.sub,.small{
  color:#718096;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }
}

input,textarea,select,button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #d8e1ea;
  font-size:16px;
}

textarea{
  min-height:120px;
  resize:vertical;
  margin-top:12px;
}

button{
  border:0;
  background:#3182ce;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.secondary{
  background:#edf2f7;
  color:#243447;
}

.danger{
  background:#e53e3e;
}

.hide{
  display:none;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
  min-width:120px;
}

.quote{
  text-align:center;
  font-weight:700;
  font-size:18px;
  padding:15px;
  background:#f0f7ff;
  border-radius:15px;
}

.entry{
  border-left:5px solid #3182ce;
  padding-left:14px;
  margin:15px 0;
}
</style>
</head>

<body>

<div class="wrap">

<!-- 标题 -->
<div class="card">
  <h1>🌟 A等生活 · 助教日记</h1>
  <div class="sub">
    记录每一天的努力、成长与助教时光
  </div>
</div>


<!-- 登录 -->
<div id="auth" class="card">

  <h2>🔐 登录 / 注册</h2>

  <p class="small">
    使用账号 + 密码，不需要填写邮箱。
  </p>

  <input
    id="username"
    autocomplete="username"
    placeholder="账号，例如 chen2026"
  >

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="密码（至少6位）"
    style="margin-top:10px"
  >

  <div class="row" style="margin-top:12px">

    <button onclick="register()">
      注册账号
    </button>

    <button onclick="login()">
      登录
    </button>

  </div>

  <p id="authMsg" class="small"></p>

</div>


<!-- 主页面 -->
<div id="app" class="hide">

  <!-- 用户 -->
  <div class="card">

    <div class="row">

      <div>
        <b id="who"></b>

        <div class="small">
          已登录 · ☁️ 云端保存
        </div>
      </div>

      <button
        class="secondary"
        onclick="logout()">
        退出登录
      </button>

    </div>

  </div>


  <!-- 每日语录 -->
  <div class="quote" id="quote"></div>


  <!-- 写日记 -->
  <div class="card">

    <h2>✍️ 写下今天</h2>

    <div class="grid">

      <input
        id="date"
        type="date"
      >

      <select id="type">
        <option>A等生活</option>
        <option>助教生活</option>
        <option>A等生活 + 助教</option>
      </select>

      <input
        id="title"
        placeholder="标题"
      >

      <select id="mood">
        <option>😊 很棒</option>
        <option>🙂 不错</option>
        <option>😐 普通</option>
        <option>😔 有点累</option>
        <option>💪 坚持</option>
      </select>

      <select id="score">
        <option>5 ⭐</option>
        <option>4 ⭐</option>
        <option>3 ⭐</option>
        <option>2 ⭐</option>
        <option>1 ⭐</option>
      </select>

    </div>


    <textarea
      id="content"
      placeholder="今天发生了什么？"
    ></textarea>


    <textarea
      id="lesson"
      placeholder="今天学到的人生道理 / 学习心得"
    ></textarea>


    <div class="row">

      <button onclick="saveEntry()">
        保存记录 ☁️
      </button>

      <button
        class="secondary"
        onclick="clearForm()">
        清空
      </button>

    </div>

    <p
      id="saveMsg"
      class="small">
    </p>

  </div>


  <!-- 日记列表 -->
  <div class="card">

    <h2>📖 我的记录</h2>

    <div class="grid">

      <input
        id="search"
        placeholder="搜索标题或内容"
        oninput="render()"
      >

      <select
        id="filter"
        onchange="render()">

        <option value="">
          全部
        </option>

        <option>
          A等生活
        </option>

        <option>
          助教生活
        </option>

        <option>
          A等生活 + 助教
        </option>

      </select>

    </div>

    <div id="list"></div>

  </div>

</div>

</div>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://covnjgtdwpsothkcasls.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MsamuvgocYfdrm_BbpXiAw_Bw6F48Z1";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   基本变量
========================= */

const USER_DOMAIN =
"@a-deng-life.local";

let currentUser = null;

let entries = [];

let editingId = null;


/* =========================
   励志语录
========================= */

const quotes = [

"今天的努力，会成为明天的底气。",

"慢一点没关系，重要的是一直向前。",

"把小事做好，就是A等生活。",

"认真生活，认真学习，认真做好每一次助教。",

"你今天的坚持，正在悄悄改变未来。",

"真正的成长，是每天比昨天更认真一点。",

"不要害怕走得慢，只要你没有停下来。",

"优秀不是天生的，是一次次坚持换来的。",

"今天多努力一点，未来就多一份选择。",

"你认真走过的每一步，都算数。",

"累的时候可以休息，但不要轻易放弃。",

"把今天过好，就是对未来最好的负责。",

"没有白费的努力，只有还没到时候的收获。",

"相信自己，你比想象中更有潜力。",

"先完成，再完美；先行动，再进步。",

"真正厉害的人，是把平凡的日子过得认真。",

"每一次坚持，都是在给未来的自己加分。",

"困难不会一直存在，坚持会让你越来越强。",

"别羡慕别人的起点，走好自己的路。",

"今天的你，正在成为明天更好的你。",

"学习不是为了证明给别人看，而是为了拥有更多可能。",

"愿你眼里有光，心里有方向，脚下有力量。",

"做一个自律的人，也做一个温柔的人。",

"把目标放在心里，把行动放在每天。",

"当你觉得坚持很难的时候，说明你正在成长。"

];


/* =========================
   初始化
========================= */

document.getElementById("quote").textContent =
"💡 " +
quotes[new Date().getDate() % quotes.length];

document.getElementById("date").value =
new Date().toISOString().slice(0,10);


/* =========================
   工具
========================= */

function cleanUser(username){

  return username
    .trim()
    .toLowerCase();

}


function validUser(username){

  return /^[a-z0-9_]{3,30}$/.test(username);

}


function internalEmail(username){

  return cleanUser(username) + USER_DOMAIN;

}


function message(id,text){

  document.getElementById(id).textContent =
  text;

}


/* =========================
   注册
========================= */

async function register(){

  const u =
    cleanUser(username.value);

  const p =
    password.value;


  if(!validUser(u)){

    return message(
      "authMsg",
      "账号只能使用3-30位英文字母、数字或下划线。"
    );

  }


  if(p.length < 6){

    return message(
      "authMsg",
      "密码至少6位。"
    );

  }


  message(
    "authMsg",
    "正在注册……"
  );


  const {data,error} =
    await sb.auth.signUp({

      email:internalEmail(u),

      password:p

    });


  if(error){

    return message(
      "authMsg",
      "注册失败："+error.message
    );

  }


  if(!data.user){

    return message(
      "authMsg",
      "注册失败，请重新尝试。"
    );

  }


  /*
    保存账号名称
  */

  const profile =
    await sb
      .from("app_accounts")
      .upsert({

        auth_user_id:data.user.id,

        username:u

      },{
        onConflict:"auth_user_id"
      });


  if(profile.error){

    return message(
      "authMsg",
      "账号建立成功，但资料保存失败："+profile.error.message
    );

  }


  if(data.session){

    await start(
      data.user,
      u
    );

    return;

  }


  message(
    "authMsg",
    "账号已经注册。请到 Supabase 关闭 Confirm email，然后就可以直接登录。"
  );

}


/* =========================
   登录
========================= */

async function login(){

  const u =
    cleanUser(username.value);

  const p =
    password.value;


  if(!validUser(u)){

    return message(
      "authMsg",
      "请输入正确的账号。"
    );

  }


  message(
    "authMsg",
    "正在登录……"
  );


  const {data,error} =
    await sb.auth.signInWithPassword({

      email:internalEmail(u),

      password:p

    });


  if(error){

    return message(
      "authMsg",
      "账号或密码不正确。"
    );

  }


  await start(
    data.user,
    u
  );

}


/* =========================
   开始使用
========================= */

async function start(user,usernameName){

  currentUser =
    user;


  let name =
    usernameName;


  const {data} =
    await sb
      .from("app_accounts")
      .select("username")
      .eq("auth_user_id",user.id)
      .maybeSingle();


  if(data?.username){

    name =
      data.username;

  }


  document.getElementById("who")
    .textContent =
    "👤 "+name;


  document.getElementById("auth")
    .classList
    .add("hide");


  document.getElementById("app")
    .classList
    .remove("hide");


  await load();

}


/* =========================
   退出
========================= */

async function logout(){

  await sb.auth.signOut();

  currentUser =
    null;

  entries =
    [];

  document.getElementById("app")
    .classList
    .add("hide");

  document.getElementById("auth")
    .classList
    .remove("hide");

}


/* =========================
   读取日记
========================= */

async function load(){

  const {data,error} =
    await sb
      .from("diary_entries")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("date",{
        ascending:false
      })
      .order("created_at",{
        ascending:false
      });


  if(error){

    return message(
      "saveMsg",
      "读取失败："+error.message
    );

  }


  entries =
    data || [];


  render();

}


/* =========================
   保存日记
========================= */

async function saveEntry(){

  if(!currentUser){

    return;

  }


  const payload = {

    user_id:
      currentUser.id,

    date:
      date.value,

    type:
      type.value,

    title:
      title.value.trim() ||
      "今天的记录",

    content:
      content.value,

    mood:
      mood.value,

    score:
      score.value,

    lesson:
      lesson.value

  };


  const wasEditing =
    !!editingId;


  let result;


  if(wasEditing){

    result =
      await sb
        .from("diary_entries")
        .update(payload)
        .eq("id",editingId)
        .eq("user_id",currentUser.id);

  }else{

    result =
      await sb
        .from("diary_entries")
        .insert(payload);

  }


  if(result.error){

    return message(
      "saveMsg",
      "保存失败："+result.error.message
    );

  }


  editingId =
    null;


  clearForm();


  await load();


  message(
    "saveMsg",
    wasEditing
      ? "记录已更新 ☁️"
      : "记录已保存到云端 ☁️"
  );

}


/* =========================
   清空
========================= */

function clearForm(){

  editingId =
    null;

  date.value =
    new Date()
      .toISOString()
      .slice(0,10);

  title.value =
    "";

  content.value =
    "";

  lesson.value =
    "";

  mood.value =
    "😊 很棒";

  score.value =
    "5 ⭐";

}


/* =========================
   编辑
========================= */

function editEntry(id){

  const e =
    entries.find(
      x => x.id === id
    );


  if(!e)return;


  editingId =
    id;

  date.value =
    e.date;

  type.value =
    e.type;

  title.value =
    e.title;

  content.value =
    e.content || "";

  lesson.value =
    e.lesson || "";

  mood.value =
    e.mood || "😊 很棒";

  score.value =
    e.score || "5 ⭐";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================
   删除
========================= */

async function delEntry(id){

  if(
    !confirm(
      "确定删除这条记录吗？"
    )
  ){

    return;

  }


  const {error} =
    await sb
      .from("diary_entries")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);


  if(error){

    return alert(
      "删除失败："+error.message
    );

  }


  await load();

}


/* =========================
   显示记录
========================= */

function render(){

  const q =
    (search.value || "")
      .toLowerCase();

  const f =
    filter.value || "";


  const arr =
    entries.filter(e =>

      (!f ||
       e.type === f)

      &&

      (!q ||

       [
         e.title,
         e.content,
         e.lesson
       ]
       .join(" ")
       .toLowerCase()
       .includes(q)
      )

    );


  if(!arr.length){

    list.innerHTML =
      "<p class='small'>还没有记录，写下第一篇吧 ✨</p>";

    return;

  }


  list.innerHTML =
    arr.map(e => `

      <div class="entry">

        <b>
          ${escapeHtml(e.title)}
        </b>

        <span class="small">

          ${e.date}
          ·
          ${escapeHtml(e.type)}
          ·
          ${escapeHtml(e.mood || "")}
          ·
          ${escapeHtml(e.score || "")}

        </span>

        <p>
          ${escapeHtml(
            e.content || ""
          ).replace(/\n/g,"<br>")}
        </p>

        ${
          e.lesson
          ?
          `<p>
            💭
            ${escapeHtml(e.lesson)}
          </p>`
          :
          ""
        }

        <div class="row">

          <button
            onclick="editEntry(${e.id})">
            编辑
          </button>

          <button
            class="danger"
            onclick="delEntry(${e.id})">
            删除
          </button>

        </div>

      </div>

    `)
    .join("");

}


/* =========================
   防止 HTML 注入
========================= */

function escapeHtml(text){

  return String(text ?? "")
    .replace(
      /[&<>"']/g,
      function(c){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"

        }[c];

      }
    );

}


/* =========================
   自动恢复登录
========================= */

(async function(){

  const {data} =
    await sb.auth.getSession();


  if(data.session){

    const user =
      data.session.user;


    let name =
      user.email
        ?.split("@")[0]
        || "用户";


    const result =
      await sb
        .from("app_accounts")
        .select("username")
        .eq(
          "auth_user_id",
          user.id
        )
        .maybeSingle();


    if(result.data?.username){

      name =
        result.data.username;

    }


    await start(
      user,
      name
    );

  }

})();

</script>

</body>
</html>
