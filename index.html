function msg(id,text){

/* =========================
   SHA-256
========================= */

async function hash(text){

  const buffer =
  await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(text)
  );

  return [
    ...new Uint8Array(buffer)
  ]
  .map(
    x =>
    x.toString(16).padStart(2,"0")
  )
  .join("");

}


/* =========================
   注册
========================= */

async function register(){

  const u =
  document.getElementById("username")
  .value
  .trim();

  const p =
  document.getElementById("password")
  .value;


  if(
    u.length < 3 ||
    p.length < 6
  ){

    return msg(
      "authMsg",
      "账号至少3个字符，密码至少6个字符。"
    );

  }


  const h =
  await hash(p);


  const {
    data,
    error
  } =
  await sb
  .from("app_accounts")
  .insert({
    username:u,
    password_hash:h
  })
  .select("id,username")
  .single();


  if(error){

    return msg(
      "authMsg",

      error.code === "23505"

      ? "这个账号已经存在，请直接登录。"

      : "注册失败："+error.message
    );

  }


  await start(data);

  msg("authMsg","");

}


/* =========================
   登录
========================= */

async function login(){

  const u =
  document.getElementById("username")
  .value
  .trim();

  const p =
  document.getElementById("password")
  .value;


  if(!u || !p){

    return msg(
      "authMsg",
      "请输入账号和密码。"
    );

  }


  const h =
  await hash(p);


  const {
    data,
    error
  } =
  await sb
  .from("app_accounts")
  .select("id,username")
  .eq("username",u)
  .eq("password_hash",h)
  .maybeSingle();


  if(error || !data){

    return msg(
      "authMsg",
      "账号或密码不正确。"
    );

  }


  await start(data);

}


/* =========================
   找回密码
========================= */

function openRecovery(){

  document
  .getElementById("recoveryModal")
  .classList
  .remove("hide");

}


function closeRecovery(){

  document
  .getElementById("recoveryModal")
  .classList

}


async function resetOldPassword(){

  const u =
  document
  .getElementById("recoveryUsername")
  .value
  .trim();

  const key =
  document
  .getElementById("recoveryKey")
  .value;

  const np =
  document
  .getElementById("newPassword")
  .value;

  const np2 =
  document
  .getElementById("newPassword2")
  .value;


  if(
    !u ||
    !key ||
    !np ||
    !np2
  ){

    return msg(
      "recoveryMsg",
      "请把资料填写完整。"
    );

  }


  if(np.length < 6){

    return msg(
      "recoveryMsg",
      "新密码至少需要6个字符。"
    );

  }


  if(np !== np2){

    return msg(
      "recoveryMsg",
      "两次输入的新密码不一样。"
    );

  }


  msg(
    "recoveryMsg",
    "正在验证旧账号……"
  );


  const recoveryHash =
  await hash(key);


  const {
    data,
    error
  } =
  await sb
  .from("app_accounts")
  .select(
    "id,username,recovery_hash"
  )
  .eq("username",u)
  .maybeSingle();


  if(error){

    return msg(
      "recoveryMsg",
      "验证失败："+error.message
    );

  }


  if(
    !data ||
    !data.recovery_hash ||
    data.recovery_hash !== recoveryHash
  ){

    return msg(
      "recoveryMsg",
      "旧账号或恢复密钥不正确。"
    );

  }


  const newHash =
  await hash(np);


  const {
    error:updateError
  } =
  await sb
  .from("app_accounts")
  .update({
    password_hash:newHash
  })
  .eq("id",data.id)
  .eq("username",data.username);


  if(updateError){

    return msg(
      "recoveryMsg",
      "修改密码失败："+updateError.message
    );

  }


  msg(
    "recoveryMsg",
    "密码修改成功，可以使用新密码登录了。"
  );


  setTimeout(()=>{

    closeRecovery();

    document.getElementById("username").value =
    u;

    document.getElementById("password").value =
    np;

  },1200);

}


/* =========================
   ⭐ 关键：照片链接处理
========================= */

/*
  数据库现在保存 Storage 路径，
  而不是永久 Signed URL。

  这样照片不会因为 Signed URL 过期
  而突然无法显示。
*/

async function getPhotoUrl(photo){

  if(!photo){
    return null;
  }


  /*
    兼容旧照片：
    如果数据库里面已经是 URL，
    直接使用。
  */

  if(
    typeof photo === "string" &&
    (
      photo.startsWith("http://") ||
      photo.startsWith("https://")
    )
  ){

    return photo;

  }


  const raw =
  String(photo)
  .replace(/^\/+/,"");


  const candidates = [

    raw

  ];


  /*
    兼容以前可能只保存文件名的情况
  */

  if(
    currentUser?.id &&
    !raw.startsWith(
      String(currentUser.id)+"/"
    )
  ){

    candidates.push(
      String(currentUser.id)+"/"+raw
    );

  }


  for(
    const path of candidates
  ){

    const {
      data,
      error
    } =
    await sb
    .storage
    .from(CLOUD_BUCKET)
    .createSignedUrl(
      path,
      60*60*24*7
    );


    if(
      !error &&
      data?.signedUrl
    ){

      return data.signedUrl;

    }

  }


  console.log(
    "找不到照片:",
    photo
  );

  return null;

}


/* =========================
   读取云端
========================= */

async function load(){

  if(!currentUser){
    return;
  }


  const {
    data,
    error
  } =
  await sb
  .from("diary_entries")
  .select("*")
  .eq(
    "account_id",
    currentUser.id
  )
  .order(
    "date",
    {ascending:false}
  )
  .order(
    "created_at",
    {ascending:false}
  );


  if(error){

    msg(
      "saveMsg",
      "读取失败："+error.message
    );

    return;

  }


  entries =
  data || [];


  /*
    把数据库里的照片路径
    转成当前可以显示的 URL
  */

  for(
    const entry of entries
  ){

    if(
      !Array.isArray(entry.photos)
    ){

      entry.photos = [];

      entry.displayPhotos = [];

      continue;

    }


    const fixed = [];


    for(
      const photo of entry.photos
    ){

      try{

        const url =
        await getPhotoUrl(photo);


        if(url){

          fixed.push(url);

        }

      }catch(e){

        console.log(
          "照片读取失败:",
          e
        );

      }

    }


    entry.displayPhotos =
    fixed;

  }


  updateStats();

  render();

}


/* =========================
   保存记录
========================= */

async function saveEntry(){

  if(!currentUser){

    return;

  }


  msg(
    "saveMsg",
    "正在保存……"
  );


  const fileInput =
  document.getElementById("photos");


  const files =
  [
    ...(fileInput.files || [])
  ];


  const photoPaths = [];


  /*
    上传照片
  */

  for(
    const file of files
  ){

    const safe =
    file.name.replace(
      /[^\w.\-一-龥]/g,
      "_"
    );


    const path =
    currentUser.id +
    "/" +
    Date.now() +
    "_" +
    Math.random()
    .toString(36)
    .slice(2) +
    "_" +
    safe;


    const {
      error:uploadError
    } =
    await sb
    .storage
    .from(CLOUD_BUCKET)
    .upload(
      path,
      file,
      {
        upsert:false
      }
    );


    if(uploadError){

      return msg(
        "saveMsg",
        "照片上传失败："+uploadError.message
      );

    }


    /*
      ⭐ 这里非常重要

      不再保存 Signed URL。

      只保存 Storage 路径。
    */

    photoPaths.push(path);

  }


  const payload = {

    account_id:
    currentUser.id,

    date:
    document.getElementById("date").value,

    type:
    document.getElementById("type").value,

    title:
    document
    .getElementById("title")
    .value
    .trim() ||
    "今天的记录",

    content:
    document
    .getElementById("content")
    .value,

    mood:
    document
    .getElementById("mood").value,

    score:
    document
    .getElementById("score").value,

    lesson:
    document
    .getElementById("lesson").value,

    photos:
    photoPaths

  };


  let result;


  /*
    编辑
  */

  if(editingId){

    const old =
    entries.find(
      x => x.id === editingId
    );


    const oldPhotos =
    Array.isArray(old?.photos)
    ? old.photos
    : [];


    payload.photos = [

      ...oldPhotos,

      ...photoPaths

    ];


    result =
    await sb
    .from("diary_entries")
    .update(payload)
    .eq(
      "id",
      editingId
    )
    .eq(
      "account_id",
      currentUser.id
    );

  }


  /*
    新记录
  */

  else{

    result =
    await sb
    .from("diary_entries")
    .insert(payload);

  }


  if(result.error){

    return msg(
      "saveMsg",
      "保存失败："+result.error.message
    );

  }


  const wasEditing =
  !!editingId;


  editingId = null;


  clearForm();


  await load();


  msg(
    "saveMsg",
    wasEditing
    ? "记录已更新 ☁️"
    : "记录已保存到云端 ☁️"
  );

}


/* =========================
   清空
========================= */

function clearForm(){

  editingId = null;


  document.getElementById("date").value =
  new Date()
  .toISOString()
  .slice(0,10);


  document.getElementById("title").value =
  "";


  document.getElementById("content").value =
  "";


  document.getElementById("lesson").value =
  "";


  document.getElementById("mood").value =
  "😊 很棒";


  document.getElementById("score").value =
  "5 ⭐";


  document.getElementById("photos").value =
  "";


  document.getElementById("photoPreview").innerHTML =
  "";

}


/* =========================
   编辑
========================= */

function editEntry(id){

  const e =
  entries.find(
    x => x.id === id
  );


  if(!e){
    return;
  }


  editingId = id;


  document.getElementById("date").value =
  e.date || "";


  document.getElementById("type").value =
  e.type || "A等生活";


  document.getElementById("title").value =
  e.title || "";


  document.getElementById("content").value =
  e.content || "";


  document.getElementById("lesson").value =
  e.lesson || "";


  document.getElementById("mood").value =
  e.mood || "😊 很棒";


  document.getElementById("score").value =
  e.score || "5 ⭐";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   删除
========================= */

async function delEntry(id){

  if(
    !confirm(
      "确定删除这条记录吗？"
    )
  ){

    return;

  }


  const {
    error
  } =
  await sb
  .from("diary_entries")
  .delete()
  .eq(
    "id",
    id
  )
  .eq(
    "account_id",
    currentUser.id
  );


  if(error){

    alert(
      "删除失败："+error.message
    );

    return;

  }


  await load();

}


/* =========================
   连续天数
========================= */

function uniqueDates(){

  return [
    ...new Set(
      entries
      .map(
        e => e.date
      )
      .filter(Boolean)
    )
  ].sort();

}


function calcStreak(){

  const ds =
  new Set(
    uniqueDates()
  );


  let d =
  new Date();


  d.setHours(
    0,0,0,0
  );


  let n = 0;


  while(
    ds.has(
      d.toISOString().slice(0,10)
    )
  ){

    n++;

    d.setDate(
      d.getDate()-1
    );

  }


  return n;

}


/* =========================
   统计
========================= */

function updateStats(){

  document.getElementById("count")
  .textContent =
  entries.length;


  document.getElementById("studyCount")
  .textContent =
  entries.filter(
    e =>
    String(e.type || "")
    .includes("A等")
  ).length;


  document.getElementById("taCount")
  .textContent =
  entries.filter(
    e =>
    String(e.type || "")
    .includes("助教")
  ).length;


  document.getElementById("streak")
  .textContent =
  calcStreak();

}


/* =========================
   HTML 安全处理
========================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[c])
  );

}


/* =========================
   显示记录
========================= */

function render(){

  const q =
  (
    document
    .getElementById("search")
    .value ||
    ""
  )
  .toLowerCase();


  const f =
  document
  .getElementById("filter")
  .value ||
  "";


  const arr =
  entries.filter(
    e =>

    (
      !f ||
      e.type === f
    )

    &&

    (
      !q ||

      [
        e.title,
        e.content,
        e.lesson
      ]
      .join(" ")
      .toLowerCase()
      .includes(q)
    )

  );


  const list =
  document.getElementById("list");


  if(!arr.length){

    list.innerHTML =
    `
      <p class="small">
        还没有记录，写下第一篇吧 ✨
      </p>
    `;

    updateStats();

    return;

  }


  list.innerHTML =
  arr.map(
    e => `

    <div class="entry">

      <div class="entry-title">
        ${esc(e.title)}
      </div>


      <div class="small">

        ${esc(e.date || "")}

        ·

        ${esc(e.type || "")}

        ·

        ${esc(e.mood || "")}

        ·

        ${esc(e.score || "")}

      </div>


      ${
        e.content

        ?

        `
        <div class="entry-content">
          ${esc(e.content).replace(
            /\n/g,
            "<br>"
          )}
        </div>
        `

        :

        ""
      }


      ${
        e.lesson

        ?

        `
        <div class="lesson">
          💭 ${esc(e.lesson).replace(
            /\n/g,
            "<br>"
          )}
        </div>
        `

        :

        ""
      }


      ${
        (
          e.displayPhotos ||
          []
        ).length

        ?

        `
        <div class="photo-grid">

          ${
            (
              e.displayPhotos ||
              []
            )
            .map(
              x => `

              <img
                src="${esc(x)}"
                alt="记录照片"
                loading="lazy"
                onclick="window.open('${esc(x)}','_blank')"
              >

              `
            )
            .join("")
          }

        </div>
        `

        :

        ""
      }


      <div
        class="row"
        style="margin-top:12px"
      >

        <button
          onclick="editEntry(${e.id})"
        >
          编辑
        </button>


        <button
          class="danger"
          onclick="delEntry(${e.id})"
        >
          删除
        </button>

      </div>

    </div>

    `
  )
  .join("");


  updateStats();

}


/* =========================
   新照片预览
========================= */

document
.getElementById("photos")
.addEventListener(
  "change",
  function(e){

    const preview =
    document.getElementById(
      "photoPreview"
    );


    preview.innerHTML =
    "";


    [
      ...e.target.files
    ]
    .forEach(
      file => {

        const img =
        document.createElement("img");


        img.src =
        URL.createObjectURL(file);


        img.alt =
        "预览";


        preview.appendChild(img);

      }
    );

  }
);


/* =========================
   登录成功
========================= */

async function start(user){

  currentUser =
  user;


  localStorage.setItem(
    "a等生活当前账号_v3",
    JSON.stringify(user)
  );


  document
  .getElementById("auth")
  .classList
  .add("hide");


  document
  .getElementById("app")
  .classList
  .remove("hide");


  document
  .getElementById("who")
  .textContent =
  "👤 " +
  user.username;


  await load();

}


/* =========================
   登出
========================= */

async function logout(){

  currentUser = null;

  entries = [];

  editingId = null;


  localStorage.removeItem(
    "a等生活当前账号_v3"
  );


  document
  .getElementById("app")
  .classList
  .add("hide");


  document
  .getElementById("auth")
  .classList
  .remove("hide");

}


/* =========================
   自动恢复登录
========================= */

(async()=>{

  try{

    const saved =
    JSON.parse(
      localStorage.getItem(
        "a等生活当前账号_v3"
      )
    );


    if(saved){

      await start(saved);

    }

  }catch(e){

    console.log(
      "自动登录失败:",
      e
    );

  }

})();

</script>
