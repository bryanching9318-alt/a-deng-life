/* =========================

========================= */

function msg(id,text){

/* =========================
   SHA256
========================= */

async function hash(s){

  const b =
  await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(s)
  );

  return [
    ...new Uint8Array(b)
  ]
  .map(
    x =>
    x.toString(16).padStart(2,"0")
  )
  .join("");

}


/* =========================
   注册
========================= */

async function register(){

  const u =
  username.value.trim();

  const p =
  password.value;

  if(
    u.length < 3 ||
    p.length < 6
  ){

    return msg(
      "authMsg",
      "账号至少3个字符，密码至少6个字符。"
    );

  }

  const h =
  await hash(p);

  const {
    data,
    error
  } =
  await sb
  .from("app_accounts")
  .insert({
    username:u,
    password_hash:h
  })
  .select("id,username")
  .single();

  if(error){

    return msg(
      "authMsg",
      error.code === "23505"
      ? "这个账号已经存在，请直接登录。"
      : "注册失败："+error.message
    );

  }

  await start(data);

  msg("authMsg","");

}


/* =========================
   登录
========================= */

async function login(){

  const u =
  username.value.trim();

  const p =
  password.value;

  if(!u || !p){

    return msg(
      "authMsg",
      "请输入账号和密码。"
    );

  }

  const h =
  await hash(p);

  const {
    data,
    error
  } =
  await sb
  .from("app_accounts")
  .select("id,username")
  .eq("username",u)
  .eq("password_hash",h)
  .maybeSingle();

  if(
    error ||
    !data
  ){

    return msg(
      "authMsg",
      "账号或密码不正确。"
    );

  }

  await start(data);

}


/* =========================
   找回旧账号
========================= */

function openRecovery(){

  document
  .getElementById("recoveryModal")
  .classList
  .remove("hide");

  msg(
    "recoveryMsg",
    ""
  );

}


function closeRecovery(){

  document
  .getElementById("recoveryModal")
  .classList
  .add("hide");

  [
    "recoveryUsername",
    "recoveryKey",
    "newPassword",
    "newPassword2"
  ]
  .forEach(
    id =>
    document.getElementById(id).value=""
  );

  msg(
    "recoveryMsg",
    ""

}


async function resetOldPassword(){

  const u =
  document
  .getElementById("recoveryUsername")
  .value
  .trim();

  const key =
  document
  .getElementById("recoveryKey")
  .value;

  const np =
  document
  .getElementById("newPassword")
  .value;

  const np2 =
  document
  .getElementById("newPassword2")
  .value;


  if(
    !u ||
    !key ||
    !np ||
    !np2
  ){

    return msg(
      "recoveryMsg",
      "请把资料填写完整。"
    );

  }


  if(np.length < 6){

    return msg(
      "recoveryMsg",
      "新密码至少需要6个字符。"
    );

  }


  if(np !== np2){

    return msg(
      "recoveryMsg",
      "两次输入的新密码不一样。"
    );

  }


  msg(
    "recoveryMsg",
    "正在验证旧账号……"
  );


  const recoveryHash =
  await hash(key);


  const {
    data,
    error
  } =
  await sb
  .from("app_accounts")
  .select(
    "id,username,recovery_hash"
  )
  .eq("username",u)
  .maybeSingle();


  if(error){

    return msg(
      "recoveryMsg",
      "验证失败："+error.message
    );

  }


  if(
    !data ||
    !data.recovery_hash ||
    data.recovery_hash !== recoveryHash
  ){

    return msg(
      "recoveryMsg",
      "旧账号或恢复密钥不正确。"
    );

  }


  const newHash =
  await hash(np);


  const {
    error:updateError
  } =
  await sb
  .from("app_accounts")
  .update({
    password_hash:newHash
  })
  .eq("id",data.id)
  .eq("username",data.username);


  if(updateError){

    return msg(
      "recoveryMsg",
      "修改密码失败："+updateError.message
    );

  }


  msg(
    "recoveryMsg",
    "密码修改成功，可以使用新密码登录了。"
  );


  setTimeout(
    ()=>{
      closeRecovery();

      username.value =
      u;

      password.value =
      np;

    },
    1200
  );

}


/* ==================================================
   照片系统
   ================================================== */


/*
  把数据库里面保存的照片资料
  转换成可以真正显示的图片 URL。
  
  新版本：
  数据库保存 Storage 路径
  
  旧版本：
  数据库可能保存 Signed URL
  或者文件名
  或者 UUID
*/

async function getPhotoUrl(photo){

  if(!photo){
    return null;
  }


  let raw =
  String(photo).trim();


  if(!raw){
    return null;
  }


  /*
    如果以前保存的是 URL，
    自动从 URL 中找出 Storage 路径。
  */

  if(
    raw.startsWith("http://") ||
    raw.startsWith("https://")
  ){

    try{

      const marker =
      "/storage/v1/object/";

      const pos =
      raw.indexOf(marker);


      if(pos >= 0){

        let part =
        raw.slice(
          pos + marker.length
        );


        /*
          去掉：
          sign/
          public/
        */

        part =
        part.replace(
          /^(sign|public)\//,
          ""
        );


        const bucketPrefix =
        CLOUD_BUCKET + "/";


        if(
          part.startsWith(bucketPrefix)
        ){

          raw =
          part
          .slice(bucketPrefix.length)
          .split("?")[0];

        }else{

          raw =
          part
          .split("?")[0];

        }


        try{

          raw =
          decodeURIComponent(raw);

        }catch(e){}

      }

    }catch(e){

      console.log(
        "旧照片 URL 解析失败:",
        e
      );

    }

  }


  /*
    清理路径
  */

  raw =
  raw.replace(
    /^\/+/,
    ""
  );


  raw =
  raw.replace(
    /^diary-photos\//,
    ""
  );


  /*
    建立多个可能路径
  */

  const candidates = [];


  const add =
  x => {

    if(
      x &&
      !candidates.includes(x)
    ){

      candidates.push(x);

    }

  };


  /*
    原始路径
  */

  add(raw);


  /*
    如果以前只保存文件名：
    
    xxx.jpg
    
    尝试：
    
    2/xxx.jpg
  */

  if(
    currentUser?.id &&
    !raw.startsWith(
      String(currentUser.id)+"/"
    )
  ){

    add(
      String(currentUser.id)+
      "/"+
      raw
    );

  }


  /*
    某些旧版本可能保存：
    
    chen_0122/xxx.jpg
  */

  if(
    currentUser?.username &&
    !raw.startsWith(
      String(currentUser.username)+"/"
    )
  ){

    add(
      String(currentUser.username)+
      "/"+
      raw
    );

  }


  /*
    逐个尝试生成 Signed URL
  */

  for(
    const path of candidates
  ){

    try{

      const {
        data,
        error
      } =
      await sb
      .storage
      .from(CLOUD_BUCKET)
      .createSignedUrl(
        path,
        60 * 60 * 24 * 7
      );


      if(
        !error &&
        data?.signedUrl
      ){

        return data.signedUrl;

      }

    }catch(e){

      console.log(
        "照片路径读取失败:",
        path,
        e
      );

    }

  }


  /*
    如果 Bucket 是公开的，
    再尝试 Public URL
  */

  for(
    const path of candidates
  ){

    try{

      const {
        data
      } =
      sb
      .storage
      .from(CLOUD_BUCKET)
      .getPublicUrl(path);


      if(
        data?.publicUrl
      ){

        return data.publicUrl;

      }

    }catch(e){}

  }


  return null;

}


/* ==================================================

async function load(){

    return;

  const {
    data,
    error
  } =
  await sb
  .from("diary_entries")
  .select("*")
  .eq(
    "account_id",
    currentUser.id
  )
  .order(
    "date",
    {
      ascending:false
    }
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(error){

    msg(
      "saveMsg",
      "读取失败："+error.message
    );

    return;

  }


  entries =
  data || [];


  /*
    为每一条记录重新取得照片链接
  */

  for(
    const entry of entries
  ){

    if(
      !Array.isArray(entry.photos)
    ){

      entry.photos = [];

      entry.displayPhotos = [];

      continue;

    }


    const fixed = [];


    for(
      const photo of entry.photos
    ){

      try{

        const url =
        await getPhotoUrl(photo);


        if(url){

          fixed.push(url);

        }

      }catch(e){

        console.log(
          "照片读取失败:",
          e
        );

      }

    }


    /*
      displayPhotos 专门用来显示
    */

    entry.displayPhotos =
    fixed;

  }


  updateStats();

  render();

}


/* ==================================================
   保存记录
   ================================================== */

async function saveEntry(){

  if(!currentUser){
    return;
  }


  msg(
    "saveMsg",
    "正在保存……"
  );


  const files =
  [
    ...(
      document
      .getElementById("photos")
      .files || []
    )
  ];


  /*
    新上传的照片只保存 Storage 路径
  */

  let photoPaths = [];


  /*
    上传照片
  */

  for(
    const file of files
  ){

    const safe =
    file.name.replace(
      /[^\w.\-一-龥]/g,
      "_"
    );


    const path =
    currentUser.id +
    "/" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2) +
    "_" +
    safe;


    const up =
    await sb
    .storage
    .from(CLOUD_BUCKET)
    .upload(
      path,
      file,
      {
        upsert:false
      }
    );


    if(up.error){

      return msg(
        "saveMsg",
        "照片上传失败："+up.error.message
      );

    }


    /*
      关键：
      不保存 Signed URL
      
      只保存真正的 Storage 路径
    */

    photoPaths.push(path);

  }


  /*
    记录资料
  */

  const payload = {

    account_id:
    currentUser.id,

    date:
    date.value,

    type:
    type.value,

    title:
    title.value.trim() ||
    "今天的记录",

    content:
    content.value,

    mood:
    mood.value,

    score:
    score.value,

    lesson:
    lesson.value,

    photos:
    photoPaths

  };


  let r;


  /*
    编辑
  */

  if(editingId){

    const old =
    entries.find(
      x => x.id === editingId
    );


    const oldPhotos =
    Array.isArray(old?.photos)
    ? old.photos
    : [];


    /*
      编辑时保留旧照片
    */

    payload.photos = [
      ...oldPhotos,
      ...photoPaths
    ];


    r =
    await sb
    .from("diary_entries")
    .update(payload)
    .eq(
      "id",
      editingId
    )
    .eq(
      "account_id",
      currentUser.id
    );

  }else{

    /*
      新记录
    */

    r =
    await sb
    .from("diary_entries")
    .insert(payload);

  }


  if(r.error){

    return msg(
      "saveMsg",
      "保存失败："+r.error.message
    );

  }


  const was =
  !!editingId;


  editingId =
  null;


  clearForm();


  /*
    重新从云端读取
    重新生成照片链接
  */

  await load();


  msg(
    "saveMsg",
    was
    ? "记录已更新 ☁️"
    : "记录已保存到云端 ☁️"
  );

}


/* ==================================================
   清空
   ================================================== */

function clearForm(){

  editingId =
  null;


  date.value =
  new Date()
  .toISOString()
  .slice(0,10);


  title.value =
  "";


  content.value =
  "";


  lesson.value =
  "";


  mood.value =
  "😊 很棒";


  score.value =
  "5 ⭐";


  document
  .getElementById("photos")
  .value =
  "";


  document
  .getElementById("photoPreview")
  .innerHTML =
  "";

}


/* ==================================================
   编辑
   ================================================== */

function editEntry(id){

  const e =
  entries.find(
    x => x.id === id
  );


  if(!e){
    return;
  }


  editingId =
  id;


  date.value =
  e.date || "";


  type.value =
  e.type ||
  "A等生活";


  title.value =
  e.title ||
  "";


  content.value =
  e.content ||
  "";


  lesson.value =
  e.lesson ||
  "";


  mood.value =
  e.mood ||
  "😊 很棒";


  score.value =
  e.score ||
  "5 ⭐";


  scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==================================================
   删除
   ================================================== */

async function delEntry(id){

  if(
    !confirm(
      "确定删除这条记录吗？"
    )
  ){

    return;

  }


  const {
    error
  } =
  await sb
  .from("diary_entries")
  .delete()
  .eq(
    "id",
    id
  )
  .eq(
    "account_id",
    currentUser.id
  );


  if(error){

    return alert(
      "删除失败："+error.message
    );

  }


  await load();

}


/* ==================================================
   日期
   ================================================== */

function uniqueDates(){

  return [
    ...new Set(
      entries
      .map(e => e.date)
      .filter(Boolean)
    )
  ]
  .sort();

}


/* ==================================================
   连续天数
   ================================================== */

function calcStreak(){

  const ds =
  new Set(
    uniqueDates()
  );


  let d =
  new Date();


  d.setHours(
    0,
    0,
    0,
    0
  );


  let n =
  0;


  while(
    ds.has(
      d.toISOString()
      .slice(0,10)
    )
  ){

    n++;


    d.setDate(
      d.getDate()-1
    );

  }


  return n;

}


/* ==================================================
   统计
   ================================================== */

function updateStats(){

  document
  .getElementById("count")
  .textContent =
  entries.length;


  document
  .getElementById("studyCount")
  .textContent =
  entries.filter(
    e =>
    String(e.type || "")
    .includes("A等")
  ).length;


  document
  .getElementById("taCount")
  .textContent =
  entries.filter(
    e =>
    String(e.type || "")
    .includes("助教")
  ).length;


  document
  .getElementById("streak")
  .textContent =
  calcStreak();

}


/* ==================================================
   显示记录
   ================================================== */

function render(){

  const q =
  (search.value || "")
  .toLowerCase();


  const f =
  (filter.value || "")
  .trim();


  const arr =
  entries.filter(
    e =>

      (!f ||
      e.type === f)

      &&

      (
        !q ||

        [
          e.title,
          e.content,
          e.lesson
        ]
        .join(" ")
        .toLowerCase()
        .includes(q)
      )

  );


  list.innerHTML =

  arr.length

  ?

  arr.map(e => `

    <div class="entry">

      <b>
        ${esc(e.title)}
      </b>

      <span class="small">
        ${esc(e.date || "")}
        ·
        ${esc(e.type || "")}
        ·
        ${esc(e.mood || "")}
        ·
        ${esc(e.score || "")}
      </span>


      <p>
        ${
          esc(e.content || "")
          .replace(/\n/g,"<br>")
        }
      </p>


      ${
        e.lesson
        ?
        `<p>
          💭 ${esc(e.lesson)}
        </p>`
        :
        ""
      }


      ${
        (e.displayPhotos || []).length

        ?

        `
        <div class="photo-grid">

          ${
            (e.displayPhotos || [])
            .map(
              x => `

                <img
                  src="${esc(x)}"
                  alt="记录照片"
                  loading="lazy"

                  onclick="
                    window.open(
                      '${esc(x)}',
                      '_blank'
                    )
                  "

                  onerror="
                    this.style.display='none';
                    this.insertAdjacentHTML(
                      'afterend',
                      '<div class=&quot;small&quot;>📷 照片暂时无法显示</div>'
                    )
                  "
                >

              `
            )
            .join("")
          }

        </div>
        `

        :

        ""
      }


      <div class="row">

        <button
          onclick="editEntry(${e.id})"
        >
          编辑
        </button>

        <button
          class="danger"
          onclick="delEntry(${e.id})"
        >
          删除
        </button>

      </div>

    </div>

  `)
  .join("")

  :

  `
    <p class="small">
      还没有记录，写下第一篇吧 ✨
    </p>
  `;


  updateStats();

}


/* ==================================================
   照片选择预览
   ================================================== */

document
.getElementById("photos")
.addEventListener(
  "change",
  e => {

    document
    .getElementById("photoPreview")
    .innerHTML =

    [
      ...e.target.files
    ]
    .map(
      f => `

        <img
          src="${URL.createObjectURL(f)}"
          alt="预览"
        >

      `
    )
    .join("");

  }
);


/* ==================================================
   HTML 转义
   ================================================== */

function esc(s){

  return String(
    s ?? ""
  )
  .replace(
    /[&<>"']/g,
    c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[c])
  );

}


/* ==================================================
   登录成功
   ================================================== */

async function start(user){

  currentUser =
  user;


  localStorage.setItem(
    "a等生活当前账号_v3",
    JSON.stringify(user)
  );


  document
  .getElementById("auth")
  .classList
  .add("hide");


  document
  .getElementById("app")
  .classList
  .remove("hide");


  document
  .getElementById("who")
  .textContent =
  "👤 " +
  user.username;


  /*
    登录以后重新读取：
    日记 + 云端照片
  */

  await load();

}


/* ==================================================
   退出
   ================================================== */

async function logout(){

  currentUser =
  null;


  entries =
  [];


  localStorage.removeItem(
    "a等生活当前账号_v3"
  );


  document
  .getElementById("app")
  .classList
  .add("hide");


  document
  .getElementById("auth")
  .classList
  .remove("hide");


  render();

}


/* ==================================================
   自动恢复登录
   ================================================== */

(async()=>{

  try{

    const u =
    JSON.parse(
      localStorage.getItem(
        "a等生活当前账号_v3"
      )
    );


    if(u){

      await start(u);

    }

  }catch(e){

    console.log(e);

  }

})();
